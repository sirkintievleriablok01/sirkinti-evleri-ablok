<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Sirkinti Evleri Yönetim Sistemi</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
:root{--bg:#f5f7fb;--surface:#fff;--surface-soft:#eef2f9;--primary:#2a5c9e;--primary-light:#e6edf9;--primary-dark:#1e3f6e;--text:#1e293b;--text-soft:#64748b;--border:#dbe3ee;--success:#2e7d32;--success-bg:#e8f5e9;--danger:#c62828;--danger-bg:#ffebee;--warning:#b26a00;--warning-bg:#fff8e1;--info:#1565c0;--info-bg:#e3f2fd;--shadow:0 2px 8px rgba(0,0,0,.05);--radius:14px;--radius-sm:10px;--wa:#25d366}
body{background:var(--bg);color:var(--text);padding-bottom:80px;font-size:14.5px;line-height:1.5}
.header{background:linear-gradient(135deg,#2a5c9e,#1e3f6e);color:#fff;padding:20px 16px 22px;border-bottom-left-radius:22px;border-bottom-right-radius:22px}
.header h1{font-size:1.05rem;font-weight:700;letter-spacing:.3px}
.header .sub{font-size:.78rem;opacity:.85;margin-top:2px}
.header-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.app{max-width:640px;margin:0 auto;padding:14px 12px}
.card{background:var(--surface);border-radius:var(--radius);padding:14px;margin-bottom:14px;box-shadow:var(--shadow);border:1px solid var(--border)}
.card-title{font-size:.95rem;font-weight:700;color:var(--primary-dark);display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.card-title .badge-cnt{background:var(--primary-light);color:var(--primary);font-size:.72rem;padding:2px 8px;border-radius:20px;font-weight:600}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat{background:#fff;border-radius:var(--radius-sm);padding:12px;box-shadow:var(--shadow);border:1px solid var(--border)}
.stat .lbl{font-size:.68rem;text-transform:uppercase;letter-spacing:.03em;color:var(--text-soft);margin-bottom:4px;font-weight:600}
.stat .val{font-size:1.25rem;font-weight:800;color:var(--primary-dark)}
.stat.green{border-left:4px solid var(--success)}.stat.red{border-left:4px solid var(--danger)}.stat.yellow{border-left:4px solid var(--warning)}.stat.blue{border-left:4px solid var(--info)}
.big-stat{background:#fff;border-radius:var(--radius);padding:20px 16px;box-shadow:var(--shadow);border:1px solid var(--border);margin-bottom:12px;text-align:center}
.big-stat .lbl{font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:var(--text-soft);margin-bottom:8px;font-weight:700}
.big-stat .val{font-size:1.9rem;font-weight:800}
.big-stat.balance{border-top:4px solid var(--success)}.big-stat.balance .val{color:var(--success)}
.big-stat.expense{border-top:4px solid var(--danger)}.big-stat.expense .val{color:var(--danger)}
.li{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);gap:10px;flex-wrap:wrap}
.li:last-child{border-bottom:none}
.li-t{font-weight:600;font-size:.88rem}
.li-d{font-size:.74rem;color:var(--text-soft);margin-top:2px}
.li-v{font-weight:700;color:var(--primary-dark);white-space:nowrap;font-size:.88rem}
.li-v.green{color:var(--success)}.li-v.red{color:var(--danger)}.li-v.teal{color:#00897b}
.li-actions{display:flex;gap:4px;flex-shrink:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 16px;border-radius:30px;font-weight:600;font-size:.85rem;border:none;cursor:pointer;transition:.15s;background:var(--surface-soft);color:var(--text)}
.btn-primary{background:var(--primary);color:#fff}.btn-success{background:var(--success);color:#fff}.btn-danger{background:var(--danger);color:#fff}.btn-wa{background:var(--wa);color:#fff}.btn-teal{background:#00897b;color:#fff}
.btn-block{width:100%}
.btn-sm{padding:6px 11px;font-size:.75rem;border-radius:20px}
.btn-xs{padding:4px 9px;font-size:.7rem;border-radius:16px}
.btn-ghost{background:rgba(255,255,255,.18);color:#fff;border:none;padding:7px 13px;border-radius:20px;font-size:.78rem;cursor:pointer;font-weight:600}
.fg{margin-bottom:10px}
.fg label{display:block;font-size:.75rem;font-weight:600;color:var(--text-soft);margin-bottom:4px}
.fc{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:#fff;font-size:.9rem;font-family:inherit}
.fc:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(42,92,158,.1)}
textarea.fc{resize:vertical;min-height:80px}
.bnav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:6px 2px max(8px,env(safe-area-inset-bottom));z-index:50;max-width:640px;margin:0 auto}
.bnav button{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.62rem;color:var(--text-soft);padding:5px 2px;flex:1;cursor:pointer;font-weight:600}
.bnav button .ic{font-size:1.15rem}
.bnav button.active{color:var(--primary)}
.apt-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.apt-btn{background:var(--surface-soft);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 2px;text-align:center;font-weight:700;font-size:.8rem;cursor:pointer;color:var(--text)}
.apt-btn.paid{background:var(--success-bg);border-color:#a5d6a7;color:#1b5e20}
.apt-btn.unpaid{background:var(--danger-bg);border-color:#ef9a9a;color:#b71c1c}
.apt-btn.partial{background:var(--warning-bg);border-color:#ffcc80;color:#e65100}
.apt-btn.muaf{background:#e9edf3;border-color:#cbd5e1;color:#5b6b7f}
.apt-btn.alacakli{background:#e0f2f1;border-color:#80cbc4;color:#00695c}
.apt-btn.empty{background:#f8fafc;border-color:#e2e8f0;color:#94a3b8}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:10px;border:1px solid var(--border);position:relative}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:.72rem;background:#fff}
th,td{padding:7px 6px;text-align:center;border-bottom:1px solid var(--border);border-right:1px solid #f1f5f9;white-space:nowrap}
th{background:#f8fafc;color:var(--text-soft);font-weight:700;font-size:.66rem;text-transform:uppercase}
td.left,th.left{text-align:left;padding-left:10px}
.sticky-col-1{position:sticky;left:0;background:#fff;z-index:3;min-width:52px}
.sticky-col-2{position:sticky;left:52px;background:#fff;z-index:3;min-width:110px;box-shadow:2px 0 4px rgba(0,0,0,.06)}
th.sticky-col-1,th.sticky-col-2{background:#f8fafc;z-index:4}
tr:last-child td{border-bottom:none}
.cell-paid{background:var(--success-bg);color:var(--success);font-weight:700}
.cell-unpaid{background:var(--danger-bg);color:var(--danger);font-weight:700}
.cell-old{background:#e9edf3;color:#5b6b7f;font-weight:600;font-style:italic}
.cell-muaf{background:var(--info-bg);color:var(--info);font-weight:700}
.cell-empty{color:#cbd5e1}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:12px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:7px 14px;border-radius:30px;background:var(--surface-soft);font-size:.78rem;font-weight:600;white-space:nowrap;cursor:pointer}
.tab.active{background:var(--primary);color:#fff}
.mov{position:fixed;inset:0;background:rgba(15,23,42,.5);display:none;align-items:flex-end;justify-content:center;z-index:200}
.mov.open{display:flex}
.mod{background:#fff;width:100%;max-width:640px;border-top-left-radius:22px;border-top-right-radius:22px;padding:20px 16px;max-height:92vh;overflow-y:auto;position:relative}
.mod .close{position:absolute;top:14px;right:14px;background:#f1f5f9;border:none;width:32px;height:32px;border-radius:50%;font-size:1rem;cursor:pointer;font-weight:700;color:#64748b;z-index:10}
.mod h2{font-size:1.05rem;margin-bottom:14px;color:var(--primary-dark);padding-right:40px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.muted{color:var(--text-soft);font-size:.78rem}
.sec-title{font-size:.78rem;font-weight:700;color:var(--primary-dark);text-transform:uppercase;letter-spacing:.04em;margin:6px 0 8px}
.divider{height:1px;background:var(--border);margin:12px 0}
.empty{text-align:center;padding:26px 16px;color:var(--text-soft);font-size:.85rem}
.tag{display:inline-block;padding:2px 8px;border-radius:6px;background:var(--surface-soft);color:var(--text-soft);font-size:.68rem;font-weight:600;margin-right:4px}
.more-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.more-item{background:#fff;border-radius:var(--radius-sm);padding:14px 10px;text-align:center;box-shadow:var(--shadow);border:1px solid var(--border);cursor:pointer;font-size:.8rem;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:6px}
.more-item .ic{font-size:1.4rem;color:var(--primary)}
.bh-row{display:grid;grid-template-columns:80px 1fr 90px;gap:6px;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:#fff;margin-bottom:5px;font-size:.78rem;align-items:center}
.bh-row .bh-date{font-weight:700;color:var(--primary-dark);font-size:.72rem}
.bh-row .bh-name{font-weight:600}
.bh-row .bh-desc{font-size:.68rem;color:var(--text-soft);grid-column:2/3}
.bh-row .bh-amt{font-weight:700;color:var(--success);text-align:right;font-size:.78rem}
.bh-actions{display:flex;gap:3px;justify-content:flex-end;grid-column:3/4;margin-top:3px}
.kalem-row{display:flex;gap:6px;margin-bottom:8px;align-items:center}
.kalem-row input{flex:1}
.kalem-row .btn-sm{padding:8px 10px;font-size:.75rem;flex-shrink:0}
.apt-check{display:flex;align-items:center;gap:6px;padding:6px 8px;border:1px solid var(--border);border-radius:8px;background:#fff;font-size:.78rem;cursor:pointer;user-select:none}
.apt-check.on{background:var(--primary-light);border-color:var(--primary);color:var(--primary-dark);font-weight:700}
.apt-check input{margin:0}
.apt-check-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}
.proj-item{background:var(--surface-soft);border-radius:var(--radius-sm);padding:12px;margin-bottom:10px;border-left:4px solid var(--primary)}
.proj-item h4{font-size:.9rem;color:var(--primary-dark);margin-bottom:4px}
.proj-item .meta{font-size:.75rem;color:var(--text-soft);margin-bottom:8px}
.proj-item .bar{height:8px;background:#dbe3ee;border-radius:10px;overflow:hidden;margin:6px 0}
.proj-item .bar-fill{height:100%;background:var(--success);border-radius:10px}
.odemeli-list{display:flex;flex-direction:column;gap:6px}
.odeme-satir{display:flex;align-items:center;gap:6px;padding:8px 10px;border:1px solid var(--border);border-radius:10px;background:#fff}
.odeme-satir.odendi{background:var(--success-bg);border-color:#a5d6a7}
.odeme-satir.kismi{background:var(--warning-bg);border-color:#ffcc80}
.odeme-satir.borc{background:var(--danger-bg);border-color:#ef9a9a}
.odeme-satir .ds-kod{font-weight:800;font-size:.82rem;min-width:38px;color:var(--primary-dark)}
.odeme-satir .ds-isim{flex:1;font-size:.78rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.odeme-satir .ds-tutar{font-size:.7rem;font-weight:700;white-space:nowrap;text-align:right}
.odeme-satir .ds-btn{flex-shrink:0;display:flex;flex-direction:column;gap:3px}
.bildirim-satir{display:flex;align-items:center;gap:8px;padding:10px;border:1px solid var(--border);border-radius:10px;background:#fff;margin-bottom:6px}
.bildirim-satir.no-phone{opacity:.55;background:#f8fafc}
.bildirim-satir .bs-check{flex-shrink:0}
.bildirim-satir .bs-info{flex:1;min-width:0}
.bildirim-satir .bs-kod{font-weight:800;color:var(--primary-dark);font-size:.82rem}
.bildirim-satir .bs-tel{font-size:.7rem;color:var(--text-soft)}
.bildirim-satir .bs-borc{font-weight:700;font-size:.78rem;color:var(--danger);text-align:right;white-space:nowrap}
.bildirim-satir .bs-borc.ok{color:var(--success)}
.hidden{display:none!important}
.uyari{background:#fff8e1;border:1px solid #ffe082;color:#8a6d00;padding:10px 12px;border-radius:10px;font-size:.78rem;margin-bottom:10px}
.uyari.teal{background:#e0f2f1;border-color:#80cbc4;color:#00695c}
.uyari.red{background:#ffebee;border-color:#ef9a9a;color:#b71c1c}
.uyari.green{background:#e8f5e9;border-color:#a5d6a7;color:#1b5e20}
.login-wrap{max-width:400px;margin:40px auto;padding:24px;background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--border)}
.login-wrap h2{text-align:center;color:var(--primary-dark);margin-bottom:6px;font-size:1.1rem}
.login-wrap .sub{text-align:center;color:var(--text-soft);font-size:.8rem;margin-bottom:20px}
.login-err{background:var(--danger-bg);color:var(--danger);border:1px solid #ef9a9a;padding:10px 12px;border-radius:10px;font-size:.82rem;margin-bottom:12px;text-align:center}
.sakin-uyari{background:linear-gradient(135deg,#e3f2fd,#bbdefb);color:#0d47a1;padding:12px 14px;border-radius:12px;margin-bottom:14px;font-size:.82rem;border:1px solid #90caf9}
#syncBar{position:fixed;top:0;left:0;right:0;height:3px;background:transparent;z-index:999;transition:background .3s}
#syncBar.saving{background:linear-gradient(90deg,#ffc107,#ff9800,#ffc107);background-size:200% 100%;animation:slide 1s linear infinite}
#syncBar.saved{background:#4caf50}
#syncBar.error{background:#f44336}
@keyframes slide{0%{background-position:0 0}100%{background-position:200% 0}}
#syncStatus{position:fixed;top:8px;right:8px;background:rgba(0,0,0,.75);color:#fff;padding:4px 10px;border-radius:20px;font-size:.7rem;font-weight:600;z-index:998;opacity:0;transition:opacity .3s}
#syncStatus.show{opacity:1}
.pdf-ozet{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.pdf-ozet .stat-mini{background:var(--surface-soft);border-radius:10px;padding:10px;text-align:center}
.pdf-ozet .stat-mini .lbl{font-size:.68rem;color:var(--text-soft);font-weight:600;text-transform:uppercase}
.pdf-ozet .stat-mini .val{font-size:1.1rem;font-weight:800;color:var(--primary-dark);margin-top:3px}
#loadingScreen{position:fixed;inset:0;background:#f5f7fb;display:flex;align-items:center;justify-content:center;flex-direction:column;z-index:9999;gap:16px}
#loadingScreen .spinner{width:44px;height:44px;border:4px solid #e0e7ef;border-top-color:#2a5c9e;border-radius:50%;animation:spin 1s linear infinite}
#loadingScreen .txt{color:#64748b;font-size:.85rem;font-weight:600}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="loadingScreen"><div class="spinner"></div><div class="txt">Yükleniyor...</div></div>
<div id="syncBar"></div>
<div id="syncStatus"></div>
<div id="app"></div>
<nav class="bnav" id="bnav"></nav>
<div class="mov" id="mov"><div class="mod" id="mod"><button class="close" onclick="closeModal()">✕</button><div id="modBody"></div></div></div>

<script>
/* =========================================================
   SİRKİNTİ EVLERİ - YÖNETİM SİSTEMİ
   Firebase: sirkintievleriablok-44064
   ========================================================= */
const STORAGE_KEY = 'sirkinti_evleri_db_v6';
const FIRESTORE_COLLECTION = 'sirkinti_data';
const FIRESTORE_DOC = 'state';
const YETKILI_EMAIL = 'yonetici@sikintievleri.com';
const TOPLAM_DAIRE = 30;
const BLOK_ADI = 'A';

const SEED_APARTMENTS = [];
for(let i = 1; i <= TOPLAM_DAIRE; i++){ SEED_APARTMENTS.push({blok: BLOK_ADI, daire: i, isim: '', telefon: '', plaka: '', evsahibi: '', evTel: ''}); }
const SEED_AIDAT = {};
SEED_APARTMENTS.forEach(a => { SEED_AIDAT[BLOK_ADI + a.daire] = new Array(12).fill(''); });
const AY_ADLARI = ['OCAK','ŞUBAT','MART','NİSAN','MAYIS','HAZİRAN','TEMMUZ','AĞUSTOS','EYLÜL','EKİM','KASIM','ARALIK'];
const AIDAT_TUTAR = 500;
const TOPLAM_BEKLE = 6000;
const DEFAULT_SABLONLAR = {
  borcHatirlatma: "Sayın {ISIM} ({DAIRE}),\n\nSirkinti Evleri yönetimi olarak bilgilendiriyoruz:\n\n💰 AİDAT DURUMU\n• Ödenen: {AIDAT_ODENEN}\n• Kalan Borç: {AIDAT_BORC}\n\n🏗️ DEMİRBAŞ DURUMU\n• Ödenen: {DEMIRBAS_ODENEN}\n• Kalan Borç: {DEMIRBAS_BORC}\n\n⏳ *TOPLAM BEKLENEN: {TOPLAM_BORC}*\n\nÖdemenizi en kısa sürede yapmanızı rica ederiz.\nİyi günler dileriz.\n— Site Yönetimi",
  borcYok: "Sayın {ISIM} ({DAIRE}),\n\nSirkinti Evleri yönetimi olarak bilgilendiriyoruz:\n\n✅ Ödemeniz bulunmamaktadır. Duyarlılığınız için teşekkür ederiz.\n\nİyi günler dileriz.\n— Site Yönetimi",
  ozelDuyuru: "Sayın {ISIM} ({DAIRE}),\n\n{ICERIK}\n\n— Site Yönetimi"
};

function loadLocalDB(){ const raw = localStorage.getItem(STORAGE_KEY); if(raw){ try{ return JSON.parse(raw); }catch(e){} } return null; }
function saveLocalDB(db){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(db)); }catch(e){} }
function seedDB(){
  return {
    apartments: JSON.parse(JSON.stringify(SEED_APARTMENTS)),
    aidat: JSON.parse(JSON.stringify(SEED_AIDAT)),
    demirbasProjeler: [],
    giderler: [], duyurular: [], islemler: [], bankaHareketleri: [],
    auditLogs: [], bildirimGecmisi: [], fazlaOdemeler: {}, bankaBakiyesi: 0,
    sablonlar: JSON.parse(JSON.stringify(DEFAULT_SABLONLAR)),
    settings:{ aidatTutar: AIDAT_TUTAR, toplamBekle: TOPLAM_BEKLE }, _seeded: true
  };
}
let db = loadLocalDB() || seedDB();
if(!db.aidat) db.aidat = JSON.parse(JSON.stringify(SEED_AIDAT));
if(!db.demirbasProjeler) db.demirbasProjeler = [];
if(!db.giderler) db.giderler = [];
if(!db.duyurular) db.duyurular = [];
if(!db.islemler) db.islemler = [];
if(!db.bankaHareketleri) db.bankaHareketleri = [];
if(!db.bildirimGecmisi) db.bildirimGecmisi = [];
if(!db.fazlaOdemeler) db.fazlaOdemeler = {};
if(db.bankaBakiyesi === undefined) db.bankaBakiyesi = 0;
if(!db.sablonlar) db.sablonlar = JSON.parse(JSON.stringify(DEFAULT_SABLONLAR));
if(!db.settings) db.settings = { aidatTutar:AIDAT_TUTAR, toplamBekle:TOPLAM_BEKLE };
if(db.apartments.length < TOPLAM_DAIRE){ for(let i = db.apartments.length + 1; i <= TOPLAM_DAIRE; i++){ db.apartments.push({blok:BLOK_ADI, daire:i, isim:'', telefon:'', plaka:'', evsahibi:'', evTel:''}); } }
db.apartments.forEach(function(a){ const k = a.blok + a.daire; if(!db.aidat[k]) db.aidat[k] = new Array(12).fill(''); });
saveLocalDB(db);

function fmtMoney(n){ const v = Number(n)||0; return v.toLocaleString('tr-TR',{minimumFractionDigits: v%1?2:0, maximumFractionDigits:2})+' ₺'; }
function fmtDate(s){ if(!s) return '-'; const d=new Date(s); if(isNaN(d))return s; return String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+d.getFullYear(); }
function aptKey(a){ return a.blok+a.daire; }
function getApt(k){ return db.apartments.find(a=>aptKey(a)===k); }
function tumDaireKodlari(){ return db.apartments.map(a=>aptKey(a)); }
function bugun(){ return new Date().toISOString().slice(0,10); }
function hucreTutar(v){ if(v === 'MUAF' || v === 'ÖDENMEDİ' || !v) return 0; if(typeof v === 'number') return v; const n = Number(v); if(!isNaN(n) && n > 0) return n; return 0; }
function aidatOdenen(k){ return (db.aidat[k] || []).reduce((s,v)=>s+hucreTutar(v), 0); }
function aidatKalanFazlaOncesi(k){ const row = db.aidat[k] || []; if(row.some(v=>v==='MUAF')) return 0; return Math.max(0, TOPLAM_BEKLE - aidatOdenen(k)); }
function fazlaOdemesi(k){ return db.fazlaOdemeler[k] || 0; }
function aidatKalan(k){ const h = aidatKalanFazlaOncesi(k); const f = fazlaOdemesi(k); return Math.max(0, h - f); }
function aidatDurum(k){
  const row = db.aidat[k] || [];
  if(row.some(v=>v==='MUAF')) return 'muaf';
  const fazla = db.fazlaOdemeler[k] || 0;
  if(fazla > 0 && aidatKalanFazlaOncesi(k) === 0) return 'alacakli';
  const kalan = aidatKalan(k);

function telToWhatsApp(tel){
  if(!tel) return '';
  const temiz = String(tel).replace(/\D/g,'');
  if(!temiz) return '';
  if(temiz.startsWith('90') && temiz.length >= 12) return temiz;
  if(temiz.startsWith('0')) return '90'+temiz.slice(1);
  if(temiz.length === 10) return '90'+temiz;
  return temiz;
}
function telGecerliMi(tel){ if(!tel) return false; const t = String(tel).trim(); if(t === '' || t === 'BİLİNMİYOR' || t === 'BILINMIYOR') return false; return t.replace(/\D/g,'').length >= 10; }
function telNormalize(tel){ if(!tel) return ''; return String(tel).replace(/\D/g,''); }
function telefonEslestiMi(a1, a2){ const a = telNormalize(a1), b = telNormalize(a2); if(!a || !b) return false; if(a === b) return true; if(a.length >= 10 && b.length >= 10) return a.slice(-10) === b.slice(-10); return false; }
function sablonDoldur(sablon, daireKodu){

/* ===== PDF ===== */
if(window.pdfjsLib){ window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; }
async function pdfMetinCikar(file){
  const arrayBuffer = await file.arrayBuffer();
  const pdf = await window.pdfjsLib.getDocument({data: arrayBuffer}).promise;
  let tumMetin = [];
  for(let i = 1; i <= pdf.numPages; i++){
    const page = await pdf.getPage(i);
    const textContent = await page.getTextContent();
    const items = textContent.items.map(function(it){ return { str: it.str, x: it.transform[4], y: it.transform[5] }; });
    const satirlar = {};
    items.forEach(function(it){ const yuvarlakY = Math.round(it.y / 3) * 3; if(!satirlar[yuvarlakY]) satirlar[yuvarlakY] = []; satirlar[yuvarlakY].push(it); });
    const yKeys = Object.keys(satirlar).map(Number).sort(function(a,b){ return b - a; });
    yKeys.forEach(function(y){ const kelimeler = satirlar[y].sort(function(a,b){ return a.x - b.x; }); const satir = kelimeler.map(function(w){ return w.str; }).join(' ').trim(); if(satir) tumMetin.push(satir); });
  }
  return tumMetin;
}
function isimMi(str){
  if(!str) return false;
  const temiz = str.trim();
  if(temiz.length < 4 || temiz.length > 60) return false;
  const kelimeler = temiz.split(/\s+/);
  if(kelimeler.length < 2) return false;
  if(/\d/.test(temiz)) return false;
  const buyukSay = kelimeler.filter(function(k){ const ilk = k.charAt(0); return ilk === ilk.toUpperCase() && ilk !== ilk.toLowerCase(); }).length;
  return buyukSay >= Math.ceil(kelimeler.length * 0.6);
}
function satirParse(satir){
  const tarihMatch = satir.match(/(\d{2})[.\/](\d{2})[.\/](\d{4})/);
  const tutarMatch = satir.match(/([\d.]+,\d{2})\s*(TL|₺)?/);
  if(!tarihMatch || !tutarMatch) return null;
  const tarih = tarihMatch[1]+'.'+tarihMatch[2]+'.'+tarihMatch[3];
  const tutar = parseFloat(tutarMatch[1].replace(/\./g,'').replace(',','.'));
  if(!tutar || tutar <= 0) return null;
  const baslangic = tarihMatch.index + tarihMatch[0].length;
  const bitis = tutarMatch.index;
  let aciklamaTum = satir.substring(baslangic, bitis).trim();
  aciklamaTum = aciklamaTum.replace(/^(Gelen Transfer|Giden Transfer|Ödeme|Para Çekme|Gelen Havale|Giden Havale|Havale|EFT|FAST|Gelen EFT)/i, '').trim().replace(/^[-\s,]+/, '').trim();
  let isim = '', aciklama = aciklamaTum;
  const virgulIndex = aciklamaTum.indexOf(',');
  if(virgulIndex > 0){ isim = aciklamaTum.substring(0, virgulIndex).trim(); aciklama = aciklamaTum.substring(virgulIndex + 1).trim(); }
  else {
    const kelimeler = aciklamaTum.split(/\s+/);
    let isimKelimeler = [];
    for(let i = 0; i < kelimeler.length; i++){ const k = kelimeler[i]; const ilk = k.charAt(0); if(ilk === ilk.toUpperCase() && ilk !== ilk.toLowerCase() && !/\d/.test(k)){ isimKelimeler.push(k); } else break; }
    if(isimKelimeler.length >= 2){ isim = isimKelimeler.join(' '); aciklama = kelimeler.slice(isimKelimeler.length).join(' '); }
    else { isim = aciklamaTum; aciklama = ''; }
  }
  return { tarih: tarih, isim: isim, tutar: tutar, aciklama: aciklama };
}
function pdfSatirlariAyikla(metinSatirlari){ const sonuclar = []; metinSatirlari.forEach(function(satir){ const r = satirParse(satir); if(r) sonuclar.push(r); }); return sonuclar; }
function pdfDaireleriAlgila(satirlar){
  const daireler = {};
  satirlar.forEach(function(s){
    if(!isimMi(s.isim)) return;
    const isim = s.isim.trim().toUpperCase();
    if(!daireler[isim]) daireler[isim] = { isim: isim, toplam: 0, adet: 0, ornekTarihler: [], ornekTutar: 0 };
    daireler[isim].toplam += s.tutar;
    daireler[isim].adet += 1;
    if(daireler[isim].ornekTarihler.length < 3) daireler[isim].ornekTarihler.push(s.tarih);
    daireler[isim].ornekTutar = s.tutar;
  });
  return Object.values(daireler);
}
async function excelMetinCikar(file){
  const arrayBuffer = await file.arrayBuffer();
  const wb = XLSX.read(arrayBuffer, {type:'array'});
  const ilkSheet = wb.Sheets[wb.SheetNames[0]];
  return XLSX.utils.sheet_to_json(ilkSheet, {header:1, raw:false, defval:''});
}
function excelDaireleriAlgila(rows){
  const daireler = {};
  if(!rows || !rows.length) return [];
  let baslangicIdx = 0;
  const ilk = rows[0] || [];
  const ilkStr = ilk.map(function(c){ return String(c).toLowerCase(); }).join(' ');
  if(ilkStr.indexOf('isim') > -1 || ilkStr.indexOf('ad') > -1 || ilkStr.indexOf('daire') > -1 || ilkStr.indexOf('blok') > -1){ baslangicIdx = 1; }
  for(let i = baslangicIdx; i < rows.length; i++){
    const row = rows[i] || [];
    if(!row.length) continue;
    let isim = '', telefon = '', plaka = '';
    for(let c = 0; c < row.length; c++){
      const cell = String(row[c]||'').trim();
      if(!cell) continue;
      if(/^[0-9\s\-\(\)\+]{10,}$/.test(cell) && !telefon){ telefon = cell; continue; }
      if(isimMi(cell) && !isim){ isim = cell.toUpperCase(); continue; }
      if(/^\d{2}\s?[A-Z]{1,3}\s?\d{2,4}$/i.test(cell) && !plaka){ plaka = cell; continue; }
    }
    if(isim){
      if(!daireler[isim]) daireler[isim] = { isim: isim, telefon: telefon, plaka: plaka, toplam: 0, adet: 0 };
      else { if(telefon && !daireler[isim].telefon) daireler[isim].telefon = telefon; if(plaka && !daireler[isim].plaka) daireler[isim].plaka = plaka; }
      daireler[isim].adet += 1;
    }
  }
  return Object.values(daireler);
}

function yukleOnayla(){

  const secChk = document.getElementById('secChk');
  if(!secChk) return;
  tumChk.classList.remove('on'); secChk.classList.add('on');
  document.getElementById('aptSelectWrap').classList.remove('hidden');
  const r = document.querySelector('input[name="kapsam"][value="sec"]'); if(r) r.checked = true;
  updateDaireBasi();
}
function toggleApt(k){
  const el = document.getElementById('chk_'+k);
  const inp = el.querySelector('input');
  el.classList.toggle('on', inp.checked);
  updateDaireBasi();
}
function secilenDaireler(){
  const r = document.querySelector('input[name="kapsam"]:checked');
  if(!r) return tumDaireKodlari();
  if(r.value === 'tum') return tumDaireKodlari();
  return Array.from(document.querySelectorAll('#aptSelectWrap input[type="checkbox"]:checked')).map(function(c){ return c.value; });
}
function updateDaireBasi(){
  let toplam = 0;
  _geciciKalemler.forEach(function(k){ toplam += Number(k.tutar)||0; });
  const sec = secilenDaireler();
  const v = sec.length ? toplam/sec.length : 0;
  const el = document.getElementById('dbVal');
  if(el) el.textContent = fmtMoney(v);
}
function projeKaydet(){
  if(!isAdmin) return;
  const baslik = document.getElementById('p_baslik').value.trim();
  if(!baslik){ alert('Başlık gerekli'); return; }
  const kalemler = _geciciKalemler.filter(function(k){ return k.ad.trim() && k.tutar>0; });
  if(!kalemler.length){ alert('En az bir kalem gerekli'); return; }
  let toplam = 0;
  kalemler.forEach(function(k){ toplam += Number(k.tutar); });
  if(_duzenlenenProjeId){
    const p = db.demirbasProjeler.find(function(x){ return x.id===_duzenlenenProjeId; });
    if(!p) return;
    p.baslik = baslik;
    p.kalemler = kalemler.map(function(k){ return {ad:k.ad.trim(), tutar:Number(k.tutar)}; });
    p.toplam = toplam;
    p.daireBasi = toplam / p.secilenDaireler.length;
    saveDB(); closeModal(); render();
    alert('Proje güncellendi.');
  } else {
    const sec = secilenDaireler();
    if(!sec.length){ alert('En az bir daire seçin'); return; }
    const daireBasi = toplam / sec.length;
    db.demirbasProjeler.push({
      id: Date.now(), baslik: baslik,
      kalemler: kalemler.map(function(k){ return {ad:k.ad.trim(), tutar:Number(k.tutar)}; }),
      toplam: toplam, secilenDaireler: sec, daireBasi: daireBasi,
      tarih: bugun(), odemeler: {}
    });
    saveDB(); closeModal(); render();
    alert('Proje kaydedildi.\n\nToplam: '+fmtMoney(toplam)+'\nDaire başı: '+fmtMoney(daireBasi)+' ('+sec.length+' daire)');
  }
  _duzenlenenProjeId = null;
}
function projeDetay(id){
  if(!isAdmin) return;
  const p = db.demirbasProjeler.find(function(x){ return x.id===id; });
  if(!p) return;
  let body = '<h2>'+p.baslik+'</h2>'
    + '<div class="muted" style="margin-bottom:10px">📅 '+fmtDate(p.tarih)+' · Daire başı: <b>'+fmtMoney(p.daireBasi)+'</b></div>'
    + '<div class="sec-title">📝 Kalemler</div>';
  p.kalemler.forEach(function(k){ body += '<div class="li"><div class="li-t">'+k.ad+'</div><div class="li-v">'+fmtMoney(k.tutar)+'</div></div>'; });
  body += '<div class="li"><div class="li-t"><b>Toplam</b></div><div class="li-v"><b>'+fmtMoney(p.toplam)+'</b></div></div>'
    + '<div class="divider"></div>'
    + '<div class="sec-title">👥 Ödeme Durumu ('+p.secilenDaireler.length+' daire)</div>'
    + '<div class="odemeli-list">';
  p.secilenDaireler.forEach(function(k){
    const a = getApt(k);
    const od = p.odemeler[k]||0;
    const kl = Math.max(0, p.daireBasi - od);
    const telVar = a && telGecerliMi(a.telefon);
    let cls = 'borc';
    if(kl === 0) cls = 'odendi';
    else if(od > 0) cls = 'kismi';
    body += '<div class="odeme-satir '+cls+'">'
      + '<div class="ds-kod">'+k+'</div>'
      + '<div class="ds-isim">'+(a?a.isim||'-':'-')+'</div>'
      + '<div class="ds-tutar">'+od.toLocaleString('tr-TR')+' / '+p.daireBasi.toLocaleString('tr-TR')
      + (kl>0?'<br><span style="color:#c62828">'+kl.toLocaleString('tr-TR')+' kaldı</span>':'<br><span style="color:#2e7d32">✓ ödendi</span>')
      + '</div>'
      + '<div class="ds-btn">'
      + '<button class="btn btn-xs btn-success" onclick="odemeAlProje('+p.id+',\''+k+'\')">💵 Al</button>'
      + (telVar?'<button class="btn btn-xs btn-wa" onclick="bildirimGonder(\''+k+'\')">📱</button>':'')
      + '</div></div>';
  });
  body += '</div><button class="btn btn-primary btn-block" style="margin-top:14px" onclick="closeModal()">Kapat</button>';
  openModal(body);
}
function odemeAlProje(projeId, k){
  if(!isAdmin) return;
  const p = db.demirbasProjeler.find(function(x){ return x.id===projeId; });
  if(!p) return;
  const mevcut = p.odemeler[k]||0;
  const kalan = Math.max(0, p.daireBasi - mevcut);
  const body = '<h2>'+k+' - Ödeme Al</h2>'
    + '<div class="li"><div class="li-t">Daire başı</div><div class="li-v">'+fmtMoney(p.daireBasi)+'</div></div>'
    + '<div class="li"><div class="li-t">Ödenen</div><div class="li-v green">'+fmtMoney(mevcut)+'</div></div>'
    + '<div class="li"><div class="li-t">Kalan</div><div class="li-v red">'+fmtMoney(kalan)+'</div></div>'
    + '<div class="fg" style="margin-top:12px"><label>Alınacak Tutar (₺)</label>'
    + '<input class="fc" type="number" step="0.01" id="odTutar" value="'+kalan+'"></div>'
    + '<button class="btn btn-primary btn-block" onclick="odemeKaydetProje('+projeId+',\''+k+'\')">Kaydet</button>'
    + '<button class="btn btn-block" style="margin-top:8px" onclick="projeDetay('+projeId+')">← Geri</button>';
  openModal(body);
}
function odemeKaydetProje(projeId, k){
  if(!isAdmin) return;
  const p = db.demirbasProjeler.find(function(x){ return x.id===projeId; });
  if(!p) return;
  const tutar = Number(document.getElementById('odTutar').value)||0;
  if(tutar <= 0){ alert('Tutar girin'); return; }
  p.odemeler[k] = (p.odemeler[k]||0) + tutar;
  bankaBakiEkle(tutar);
  saveDB(); projeDetay(projeId);
  alert(fmtMoney(tutar)+' ödeme alındı ve kasaya eklendi.');
}
function projeSil(id){
  if(!isAdmin) return;
  if(!confirm('Proje silinsin mi?')) return;
  db.demirbasProjeler = db.demirbasProjeler.filter(function(p){ return p.id!==id; });
  saveDB(); render();
}
/* ============ FIREBASE ============ */
let _fbReady = false;
let _fbSaveTimer = null;
let _fs = null, _doc = null, _setDoc = null, _getDoc = null, _onSnapshot = null;
let _auth = null, _signInWithEmailAndPassword = null, _signOut = null, _onAuthStateChanged = null;

function setSyncStatus(status, msg){
  const bar = document.getElementById('syncBar');
  const st = document.getElementById('syncStatus');
  if(!bar || !st) return;
  bar.className = '';
  if(status === 'saving'){ bar.classList.add('saving'); st.textContent = msg||'💾 Kaydediliyor...'; st.classList.add('show'); }
  else if(status === 'saved'){ bar.classList.add('saved'); st.textContent = '✓ Buluta kaydedildi'; st.classList.add('show'); setTimeout(function(){ st.classList.remove('show'); }, 1500); setTimeout(function(){ bar.className=''; }, 1500); }
  else if(status === 'error'){ bar.classList.add('error'); st.textContent = '⚠️ '+(msg||'Bağlantı hatası'); st.classList.add('show'); }
}
function saveToCloud(){
  if(!_fbReady || !_setDoc || !isAdmin) return;
  setSyncStatus('saving');
  clearTimeout(_fbSaveTimer);
  _fbSaveTimer = setTimeout(async function(){
    try{ await _setDoc(_doc(_fs, FIRESTORE_COLLECTION, FIRESTORE_DOC), JSON.parse(JSON.stringify(db))); setSyncStatus('saved'); }
    catch(e){ console.error('Firebase save error:', e); setSyncStatus('error', e.message); }
  }, 600);
}
function saveDB(){ window.db = db; saveLocalDB(db); saveToCloud(); }
async function loadFromCloud(){
  if(!_getDoc) return false;
  try{
    const ref = _doc(_fs, FIRESTORE_COLLECTION, FIRESTORE_DOC);
    const snap = await _getDoc(ref);
    if(snap.exists()){
      const cloudData = snap.data();
      if(cloudData && cloudData.apartments && cloudData.apartments.length){
        db = cloudData;
        if(!db.fazlaOdemeler) db.fazlaOdemeler = {};
        if(!db.islemler) db.islemler = [];
        if(!db.bankaHareketleri) db.bankaHareketleri = [];
        if(!db.demirbasProjeler) db.demirbasProjeler = [];
        if(db.bankaBakiyesi === undefined) db.bankaBakiyesi = 0;
        if(!db.sablonlar) db.sablonlar = JSON.parse(JSON.stringify(DEFAULT_SABLONLAR));
        if(!db.bildirimGecmisi) db.bildirimGecmisi = [];
        if(db.apartments.length < TOPLAM_DAIRE){ for(let i = db.apartments.length + 1; i <= TOPLAM_DAIRE; i++){ db.apartments.push({blok:BLOK_ADI, daire:i, isim:'', telefon:'', plaka:'', evsahibi:'', evTel:''}); } }
        db.apartments.forEach(function(a){ const k = a.blok + a.daire; if(!db.aidat[k]) db.aidat[k] = new Array(12).fill(''); });
        saveLocalDB(db); window.db = db;
      } else await _setDoc(ref, JSON.parse(JSON.stringify(db)));
    } else await _setDoc(ref, JSON.parse(JSON.stringify(db)));
    return true;
  }catch(e){ console.error('Firebase load error:', e); return false; }
}
function startRealtimeSync(){
  if(!_onSnapshot) return;
  try{
    const ref = _doc(_fs, FIRESTORE_COLLECTION, FIRESTORE_DOC);
    let first = true;
    _onSnapshot(ref, function(snap){
      if(first){ first = false; return; }
      if(snap.exists()){
        const cloudData = snap.data();
        if(JSON.stringify(db) !== JSON.stringify(cloudData)){
          db = cloudData;
          if(!db.islemler) db.islemler = [];
          if(!db.bankaHareketleri) db.bankaHareketleri = [];
          if(!db.demirbasProjeler) db.demirbasProjeler = [];
          saveLocalDB(db); window.db = db; render();
        }
      }
    });
  }catch(e){ console.warn('Realtime sync error:', e); }
}

async function adminLogin(email, pass){
  try{ await _signInWithEmailAndPassword(_auth, email, pass); return { ok: true }; }
  catch(e){
    let msg = 'Giriş başarısız.';
    if(e.code === 'auth/wrong-password') msg = 'Şifre hatalı.';
    else if(e.code === 'auth/user-not-found') msg = 'Bu e-posta ile kayıtlı kullanıcı yok.';
    else if(e.code === 'auth/invalid-email') msg = 'Geçersiz e-posta adresi.';
    else if(e.code === 'auth/too-many-requests') msg = 'Çok fazla deneme. Lütfen bekleyin.';
    else if(e.code === 'auth/invalid-credential') msg = 'E-posta veya şifre hatalı.';
    else if(e.code === 'auth/unauthorized-domain') msg = 'Domain yetkili değil.';
    else if(!_auth) msg = 'Bulut bağlantısı yok. Sayfayı yenileyin.';
    return { ok: false, msg: msg };
  }
}

  }
  nav.innerHTML = items;

}
function navTo(page){
  if(page === 'login'){ currentPage = 'login'; renderNav(); render(); window.scrollTo(0,0); return; }
  if(page === 'sakin-login'){ currentPage = 'sakin-login'; renderNav(); render(); window.scrollTo(0,0); return; }
  if(page === 'sakin-home'){ if(!sakinDaireKodu){ return; } currentPage = 'sakin-home'; renderNav(); render(); window.scrollTo(0,0); return; }
  if(!isAdmin && page!=='home'){ return; }
  currentPage = page; renderNav(); render(); window.scrollTo(0,0);
}
function render(){
  const app = document.getElementById('app');
  try{
    if(currentPage === 'login'){ app.innerHTML = viewLogin(); return; }
    if(currentPage === 'sakin-login'){ app.innerHTML = viewSakinLogin(); return; }
    if(currentPage === 'sakin-home'){ app.innerHTML = viewSakinHome(); return; }
    switch(currentPage){
      case 'home': app.innerHTML = viewHome(); break;
      case 'apartments': app.innerHTML = viewApartments(); break;
      case 'aidat': app.innerHTML = viewAidat(); break;
      case 'demirbas': app.innerHTML = viewDemirbas(); break;
      case 'gider': app.innerHTML = viewGider(); break;
      case 'more': app.innerHTML = viewMore(); break;
      case 'islemler': app.innerHTML = viewIslemler(); break;
      case 'duyurular': app.innerHTML = viewDuyurular(); break;
      case 'bildirimler': app.innerHTML = viewBildirimler(); break;
      case 'sablonlar': app.innerHTML = viewSablonlar(); break;
      default: app.innerHTML = viewHome();
    }
  }catch(e){
    console.error('Render hatası:', e);
    app.innerHTML = '<div style="padding:30px;text-align:center"><h2>⚠️ Hata</h2><p>'+e.message+'</p><button onclick="location.reload()" style="margin-top:20px;padding:10px 20px;border-radius:20px;border:none;background:#2a5c9e;color:#fff;font-weight:600">Yenile</button></div>';
  }
}

function saveAidat(k, ayIndex){
  if(!isAdmin) return;
  if(!db.aidat[k]) db.aidat[k] = new Array(12).fill('');
  const tip = window._aidatSec;
  const eskiTutar = hucreTutar(db.aidat[k][ayIndex]);
  let val = '', yeniTutar = 0;
  if(tip === 'odendi'){ yeniTutar = AIDAT_TUTAR; val = AIDAT_TUTAR; }
  else if(tip === 'tutar'){
    const t = Number(document.getElementById('aidatTutarInput').value)||0;
    if(t <= 0){ alert('Geçerli tutar girin'); return; }
    yeniTutar = t; val = t;
    if(t > AIDAT_TUTAR){ db.fazlaOdemeler[k] = (db.fazlaOdemeler[k]||0) + (t - AIDAT_TUTAR); alert('Fazla: '+fmtMoney(t-AIDAT_TUTAR)); }
  }
  else if(tip === 'odenmedi') val = 'ÖDENMEDİ';
  else if(tip === 'muaf') val = 'MUAF';
  else val = '';
  const fark = yeniTutar - eskiTutar;
  if(fark > 0) bankaBakiEkle(fark); else if(fark < 0) bankaBakiDus(-fark);
  db.aidat[k][ayIndex] = val;
  saveDB(); closeModal(); aptDetay(k);
}

    } else {
      html += '<label class="bildirim-satir"><input type="checkbox" class="bs-check" value="'+k+'" data-borc="'+toplam+'" '+(toplam>0?'checked':'')+'>'

        + '<div class="bs-borc '+(toplam>0?'':'ok')+'">'+(toplam>0?fmtMoney(toplam):'borç yok')+'</div></label>';

function topluSec(mod){
  document.querySelectorAll('#bildirimListesi input[type="checkbox"]').forEach(function(c){
    const b = Number(c.dataset.borc)||0;
    if(mod === 'hepsi') c.checked = true;
    else if(mod === 'borclu') c.checked = b > 0;
    else c.checked = false;
  });
}
function topluGonder(){
  const secili = Array.from(document.querySelectorAll('#bildirimListesi input[type="checkbox"]:checked')).map(function(c){ return c.value; });
  if(!secili.length){ alert('Daire seçilmedi'); return; }
  if(!confirm(secili.length+' daireye WhatsApp açılacak.')) return;
  secili.forEach(function(k, i){ setTimeout(function(){ bildirimGonder(k); }, i * 700); });
}

function giderEkle(){
  const rec = { id: Date.now(), aciklama: document.getElementById('g_aciklama').value.trim(), ay: document.getElementById('g_ay').value.trim(), tutar: Number(document.getElementById('g_tutar').value)||0, tarih: document.getElementById('g_tarih').value, durum:'Ödendi' };
  if(!rec.aciklama){ alert('Açıklama gerekli'); return; }
  db.giderler.push(rec);
  if(rec.tutar > 0) bankaBakiDus(rec.tutar);
  saveDB(); render(); alert('Gider eklendi.');
}
function giderSil(id){
  if(!confirm('Silinsin mi?')) return;
  const g = db.giderler.find(function(x){ return x.id===id; });
  if(g && Number(g.tutar) > 0) bankaBakiEkle(Number(g.tutar));
  db.giderler = db.giderler.filter(function(x){ return x.id!==id; });
  saveDB(); render();
}

function excelCikar(){
  try{
    const wb = XLSX.utils.book_new();
    const dData = [['BLOK','DAİRE','İSİM','TELEFON','PLAKA','EV SAHİBİ','EV TEL','AİDAT BORCU','DEMİRBAŞ BORCU']];
    db.apartments.forEach(function(a){ const k = aptKey(a); dData.push([a.blok, a.daire, a.isim||'', a.telefon||'', a.plaka||'', a.evsahibi||'', a.evTel||'', aidatKalan(k), demirbasToplamBorc(k)]); });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(dData), 'DAİRELER');
    const aData = [['BLOK','DAİRE','İSİM'].concat(AY_ADLARI).concat(['ÖDENEN','KALAN'])];
    db.apartments.forEach(function(a){ const k = aptKey(a); const row = db.aidat[k]||[]; aData.push([a.blok, a.daire, a.isim||''].concat(AY_ADLARI.map(function(_, i){ return row[i]||''; })).concat([aidatOdenen(k), aidatKalan(k)])); });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aData), 'AİDAT');
    if(db.demirbasProjeler.length){
      const dmData = [['PROJE','DAİRE','İSİM','DAİRE BAŞI','ÖDENEN','KALAN']];
      db.demirbasProjeler.forEach(function(p){
        p.secilenDaireler.forEach(function(k){ const a = getApt(k); const od = p.odemeler[k]||0; dmData.push([p.baslik, k, a?a.isim||'':'', p.daireBasi, od, Math.max(0, p.daireBasi-od)]); });
      });
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(dmData), 'DEMİRBAŞ');
    }
    const gData = [['AÇIKLAMA','AY','TUTAR','TARİH']];
    db.giderler.forEach(function(g){ gData.push([g.aciklama||'', g.ay||'', g.tutar||0, g.tarih||'']); });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(gData), 'GİDER');
    XLSX.writeFile(wb, 'Sirkinti_Evleri_'+bugun()+'.xlsx');
  }catch(e){ alert('Excel oluşturulamadı: '+e.message); }
}
