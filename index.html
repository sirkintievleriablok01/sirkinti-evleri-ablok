<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Sırkıntı Evleri Yönetim Sistemi</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
:root{--bg:#f5f7fb;--surface:#fff;--surface-soft:#eef2f9;--primary:#2a5c9e;--primary-light:#e6edf9;--primary-dark:#1e3f6e;--text:#1e293b;--text-soft:#64748b;--border:#dbe3ee;--success:#2e7d32;--success-bg:#e8f5e9;--danger:#c62828;--danger-bg:#ffebee;--warning:#b26a00;--warning-bg:#fff8e1;--info:#1565c0;--info-bg:#e3f2fd;--shadow:0 2px 8px rgba(0,0,0,.05);--radius:14px;--radius-sm:10px;--wa:#25d366;--gold:#f5b400}
body{background:var(--bg);color:var(--text);padding-bottom:80px;font-size:14.5px;line-height:1.5}
.header{background:linear-gradient(135deg,#2a5c9e,#1e3f6e);color:#fff;padding:20px 16px 22px;border-bottom-left-radius:22px;border-bottom-right-radius:22px}
.header h1{font-size:1.05rem;font-weight:700;letter-spacing:.3px}
.header h1 .building{color:#f5b400;font-size:1.15rem;margin-left:2px}
.header .sub{font-size:.78rem;opacity:.85;margin-top:2px}
.header .sub .copy{display:inline-block;border:1px solid rgba(255,255,255,.6);border-radius:50%;width:14px;height:14px;line-height:12px;text-align:center;font-size:.6rem;font-weight:700;margin-left:3px;vertical-align:middle}
.header-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.app{max-width:640px;margin:0 auto;padding:14px 12px}
.card{background:var(--surface);border-radius:var(--radius);padding:14px;margin-bottom:14px;box-shadow:var(--shadow);border:1px solid var(--border)}
.card-title{font-size:.95rem;font-weight:700;color:var(--primary-dark);display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.card-title .badge-cnt{background:var(--primary-light);color:var(--primary);font-size:.72rem;padding:2px 8px;border-radius:20px;font-weight:600}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat{background:#fff;border-radius:var(--radius-sm);padding:12px;box-shadow:var(--shadow);border:1px solid var(--border)}
.stat .lbl{font-size:.68rem;text-transform:uppercase;letter-spacing:.03em;color:var(--text-soft);margin-bottom:4px;font-weight:600}
.stat .val{font-size:1.25rem;font-weight:800;color:var(--primary-dark)}
.stat.green{border-left:4px solid var(--success)}.stat.red{border-left:4px solid var(--danger)}.stat.yellow{border-left:4px solid var(--warning)}.stat.blue{border-left:4px solid var(--info)}.stat.teal{border-left:4px solid #00897b}
.big-stat{background:#fff;border-radius:var(--radius);padding:20px 16px;box-shadow:var(--shadow);border:1px solid var(--border);margin-bottom:12px;text-align:center}
.big-stat .lbl{font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:var(--text-soft);margin-bottom:8px;font-weight:700}
.big-stat .val{font-size:1.9rem;font-weight:800;letter-spacing:-.02em}
.big-stat.balance{border-top:4px solid var(--success)}.big-stat.balance .val{color:var(--success)}
.big-stat.expense{border-top:4px solid var(--danger)}.big-stat.expense .val{color:var(--danger)}
.big-stat.income{border-top:4px solid var(--info)}.big-stat.income .val{color:var(--info)}
.li{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);gap:10px;flex-wrap:wrap}
.li:last-child{border-bottom:none}
.li-t{font-weight:600;font-size:.88rem}
.li-d{font-size:.74rem;color:var(--text-soft);margin-top:2px}
.li-v{font-weight:700;color:var(--primary-dark);white-space:nowrap;font-size:.88rem}
.li-v.green{color:var(--success)}.li-v.red{color:var(--danger)}.li-v.teal{color:#00897b}.li-v.blue{color:var(--info)}
.li-actions{display:flex;gap:4px;flex-shrink:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 16px;border-radius:30px;font-weight:600;font-size:.85rem;border:none;cursor:pointer;transition:.15s;background:var(--surface-soft);color:var(--text)}
.btn-primary{background:var(--primary);color:#fff}.btn-success{background:var(--success);color:#fff}.btn-danger{background:var(--danger);color:#fff}.btn-wa{background:var(--wa);color:#fff}.btn-teal{background:#00897b;color:#fff}.btn-info{background:var(--info);color:#fff}.btn-warning{background:var(--warning);color:#fff}
.btn-block{width:100%}
.btn-sm{padding:6px 11px;font-size:.75rem;border-radius:20px}
.btn-xs{padding:4px 9px;font-size:.7rem;border-radius:16px}
.btn-ghost{background:rgba(255,255,255,.18);color:#fff;border:none;padding:7px 13px;border-radius:20px;font-size:.78rem;cursor:pointer;font-weight:600}
.fg{margin-bottom:10px}
.fg label{display:block;font-size:.75rem;font-weight:600;color:var(--text-soft);margin-bottom:4px}
.fc{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:#fff;font-size:.9rem;font-family:inherit}
.fc:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(42,92,158,.1)}
textarea.fc{resize:vertical;min-height:80px}
.bnav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:6px 2px max(8px,env(safe-area-inset-bottom));z-index:50;max-width:640px;margin:0 auto}
.bnav button{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.6rem;color:var(--text-soft);padding:5px 2px;flex:1;cursor:pointer;font-weight:600;line-height:1.15}
.bnav button .ic{font-size:1.2rem;line-height:1}
.bnav button.active{color:var(--primary)}
.apt-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.apt-btn{background:var(--surface-soft);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 2px;text-align:center;font-weight:700;font-size:.8rem;cursor:pointer;color:var(--text)}
.apt-btn.paid{background:var(--success-bg);border-color:#a5d6a7;color:#1b5e20}
.apt-btn.unpaid{background:var(--danger-bg);border-color:#ef9a9a;color:#b71c1c}
.apt-btn.partial{background:var(--warning-bg);border-color:#ffcc80;color:#e65100}
.apt-btn.muaf{background:#e9edf3;border-color:#cbd5e1;color:#5b6b7f}
.apt-btn.alacakli{background:#e0f2f1;border-color:#80cbc4;color:#00695c}
.apt-btn.empty{background:#f8fafc;border-color:#e2e8f0;color:#94a3b8}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:10px;border:1px solid var(--border);position:relative}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:.72rem;background:#fff}
th,td{padding:7px 6px;text-align:center;border-bottom:1px solid var(--border);border-right:1px solid #f1f5f9;white-space:nowrap}
th{background:#f8fafc;color:var(--text-soft);font-weight:700;font-size:.66rem;text-transform:uppercase}
td.left,th.left{text-align:left;padding-left:10px}
.sticky-col-1{position:sticky;left:0;background:#fff;z-index:3;min-width:52px}
.sticky-col-2{position:sticky;left:52px;background:#fff;z-index:3;min-width:110px;box-shadow:2px 0 4px rgba(0,0,0,.06)}
th.sticky-col-1,th.sticky-col-2{background:#f8fafc;z-index:4}
tr:last-child td{border-bottom:none}
.cell-paid{background:var(--success-bg);color:var(--success);font-weight:700}
.cell-unpaid{background:var(--danger-bg);color:var(--danger);font-weight:700}
.cell-old{background:#e9edf3;color:#5b6b7f;font-weight:600;font-style:italic}
.cell-muaf{background:var(--info-bg);color:var(--info);font-weight:700}
.cell-empty{color:#cbd5e1}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:12px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:7px 14px;border-radius:30px;background:var(--surface-soft);font-size:.78rem;font-weight:600;white-space:nowrap;cursor:pointer}
.tab.active{background:var(--primary);color:#fff}
.mov{position:fixed;inset:0;background:rgba(15,23,42,.5);display:none;align-items:flex-end;justify-content:center;z-index:200}
.mov.open{display:flex}
.mod{background:#fff;width:100%;max-width:640px;border-top-left-radius:22px;border-top-right-radius:22px;padding:20px 16px;max-height:92vh;overflow-y:auto;position:relative}
.mod .close{position:absolute;top:14px;right:14px;background:#f1f5f9;border:none;width:32px;height:32px;border-radius:50%;font-size:1rem;cursor:pointer;font-weight:700;color:#64748b;z-index:10}
.mod h2{font-size:1.05rem;margin-bottom:14px;color:var(--primary-dark);padding-right:40px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.muted{color:var(--text-soft);font-size:.78rem}
.sec-title{font-size:.78rem;font-weight:700;color:var(--primary-dark);text-transform:uppercase;letter-spacing:.04em;margin:6px 0 8px}
.divider{height:1px;background:var(--border);margin:12px 0}
.empty{text-align:center;padding:26px 16px;color:var(--text-soft);font-size:.85rem}
.tag{display:inline-block;padding:2px 8px;border-radius:6px;background:var(--surface-soft);color:var(--text-soft);font-size:.68rem;font-weight:600;margin-right:4px}
.more-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.more-item{background:#fff;border-radius:var(--radius-sm);padding:12px 6px;text-align:center;box-shadow:var(--shadow);border:1px solid var(--border);cursor:pointer;font-size:.72rem;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:5px;line-height:1.2}
.more-item .ic{font-size:1.6rem;line-height:1}
.kalem-row{display:flex;gap:6px;margin-bottom:8px;align-items:center}
.kalem-row input{flex:1}
.kalem-row .btn-sm{padding:8px 10px;font-size:.75rem;flex-shrink:0}
.apt-check{display:flex;align-items:center;gap:6px;padding:6px 8px;border:1px solid var(--border);border-radius:8px;background:#fff;font-size:.78rem;cursor:pointer;user-select:none}
.apt-check.on{background:var(--primary-light);border-color:var(--primary);color:var(--primary-dark);font-weight:700}
.apt-check input{margin:0}
.apt-check-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}
.proj-item{background:var(--surface-soft);border-radius:var(--radius-sm);padding:12px;margin-bottom:10px;border-left:4px solid var(--primary)}
.proj-item h4{font-size:.9rem;color:var(--primary-dark);margin-bottom:4px}
.proj-item .meta{font-size:.75rem;color:var(--text-soft);margin-bottom:8px}
.proj-item .bar{height:8px;background:#dbe3ee;border-radius:10px;overflow:hidden;margin:6px 0}
.proj-item .bar-fill{height:100%;background:var(--success);border-radius:10px}
.odemeli-list{display:flex;flex-direction:column;gap:6px}
.odeme-satir{display:flex;align-items:center;gap:6px;padding:8px 10px;border:1px solid var(--border);border-radius:10px;background:#fff}
.odeme-satir.odendi{background:var(--success-bg);border-color:#a5d6a7}
.odeme-satir.kismi{background:var(--warning-bg);border-color:#ffcc80}
.odeme-satir.borc{background:var(--danger-bg);border-color:#ef9a9a}
.odeme-satir .ds-kod{font-weight:800;font-size:.82rem;min-width:38px;color:var(--primary-dark)}
.odeme-satir .ds-isim{flex:1;font-size:.78rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.odeme-satir .ds-tutar{font-size:.7rem;font-weight:700;white-space:nowrap;text-align:right}
.odeme-satir .ds-btn{flex-shrink:0;display:flex;flex-direction:column;gap:3px}
.bildirim-satir{display:flex;align-items:center;gap:8px;padding:10px;border:1px solid var(--border);border-radius:10px;background:#fff;margin-bottom:6px}
.bildirim-satir.no-phone{opacity:.55;background:#f8fafc}
.bildirim-satir .bs-check{flex-shrink:0}
.bildirim-satir .bs-info{flex:1;min-width:0}
.bildirim-satir .bs-kod{font-weight:800;color:var(--primary-dark);font-size:.82rem}
.bildirim-satir .bs-tel{font-size:.7rem;color:var(--text-soft)}
.bildirim-satir .bs-borc{font-weight:700;font-size:.78rem;color:var(--danger);text-align:right;white-space:nowrap}
.bildirim-satir .bs-borc.ok{color:var(--success)}
.bh-row{display:grid;grid-template-columns:80px 1fr 90px;gap:6px;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:#fff;margin-bottom:5px;font-size:.78rem;align-items:center}
.bh-row .bh-date{font-weight:700;color:var(--primary-dark);font-size:.72rem}
.bh-row .bh-name{font-weight:600}
.bh-row .bh-desc{font-size:.68rem;color:var(--text-soft);grid-column:2/3}
.bh-row .bh-amt{font-weight:700;color:var(--success);text-align:right;font-size:.78rem}
.bh-actions{display:flex;gap:3px;justify-content:flex-end;grid-column:3/4;margin-top:3px}
.hidden{display:none!important}
.uyari{background:#fff8e1;border:1px solid #ffe082;color:#8a6d00;padding:10px 12px;border-radius:10px;font-size:.78rem;margin-bottom:10px}
.uyari.teal{background:#e0f2f1;border-color:#80cbc4;color:#00695c}
.uyari.red{background:#ffebee;border-color:#ef9a9a;color:#b71c1c}
.uyari.green{background:#e8f5e9;border-color:#a5d6a7;color:#1b5e20}
.uyari.blue{background:#e3f2fd;border-color:#90caf9;color:#1565c0}
.login-wrap{max-width:400px;margin:40px auto;padding:24px;background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--border)}
.login-wrap h2{text-align:center;color:var(--primary-dark);margin-bottom:6px;font-size:1.1rem}
.login-wrap .sub{text-align:center;color:var(--text-soft);font-size:.8rem;margin-bottom:20px}
.login-err{background:var(--danger-bg);color:var(--danger);border:1px solid #ef9a9a;padding:10px 12px;border-radius:10px;font-size:.82rem;margin-bottom:12px;text-align:center}
.sakin-uyari{background:linear-gradient(135deg,#e3f2fd,#bbdefb);color:#0d47a1;padding:12px 14px;border-radius:12px;margin-bottom:14px;font-size:.82rem;border:1px solid #90caf9}
#syncBar{position:fixed;top:0;left:0;right:0;height:3px;background:transparent;z-index:999;transition:background .3s}
#syncBar.saving{background:linear-gradient(90deg,#ffc107,#ff9800,#ffc107);background-size:200% 100%;animation:slide 1s linear infinite}
#syncBar.saved{background:#4caf50}
#syncBar.error{background:#f44336}
@keyframes slide{0%{background-position:0 0}100%{background-position:200% 0}}
#syncStatus{position:fixed;top:8px;right:8px;background:rgba(0,0,0,.75);color:#fff;padding:4px 10px;border-radius:20px;font-size:.7rem;font-weight:600;z-index:998;opacity:0;transition:opacity .3s}
#syncStatus.show{opacity:1}
.err-box{background:var(--danger-bg);border:2px solid var(--danger);color:var(--danger);padding:16px;border-radius:12px;margin:20px;font-family:monospace;font-size:.8rem;word-break:break-word}
.pdf-ozet-row{display:flex;align-items:center;gap:6px;padding:6px 8px;border-bottom:1px solid #eee;font-size:.75rem;flex-wrap:wrap}
.pdf-ozet-kod{font-weight:800;min-width:38px;color:var(--primary-dark)}
.pdf-ozet-isim{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pdf-ay{display:inline-block;width:20px;text-align:center;font-size:.7rem;font-weight:700;padding:2px 0;margin:1px;border-radius:4px}
.pdf-ay.odendi{background:var(--success-bg);color:var(--success)}
.pdf-ay.borc{background:var(--danger-bg);color:var(--danger)}
.pdf-ay.bos{background:#f1f5f9;color:#94a3b8}
.pin-input{font-size:1.4rem !important;letter-spacing:12px;text-align:center;font-family:monospace;font-weight:700}
.pin-input::placeholder{letter-spacing:8px;color:#cbd5e1}
</style>
</head>
<body>
<div id="syncBar"></div>
<div id="syncStatus"></div>
<div id="app"></div>
<nav class="bnav" id="bnav"></nav>
<div class="mov" id="mov"><div class="mod" id="mod" onclick="event.stopPropagation()"><button class="close" onclick="closeModal()">✕</button><div id="modBody"></div></div></div>

<script>
// ============================================================
// GLOBAL DEĞİŞKENLER
// ============================================================
var _fbReady = false;
var _fbSaveTimer = null;
var _fs = null, _doc = null, _setDoc = null, _getDoc = null, _onSnapshot = null;
var _auth = null, _signInWithEmailAndPassword = null, _signOut = null, _onAuthStateChanged = null, _currentUser = null;
var _modalOpen = false;
var _renderInProgress = false;

var STORAGE_KEY = 'sirkinti_db_v3';
var FIRESTORE_COLLECTION = 'sirkinti_data';
var FIRESTORE_DOC = 'state';
var YETKILI_EMAIL = 'yonetici@sirkintievleri.com';
var TOPLAM_DAIRE = 30;
var BLOK_ADI = 'A';
var KASA_BASLANGIC_VARSAYILAN = 0;

var SEED_APARTMENTS = [];
for(var i = 1; i <= TOPLAM_DAIRE; i++){
  SEED_APARTMENTS.push({
    blok:BLOK_ADI, daire:i, isim:'', telefon:'', plaka:'', evsahibi:'', evTel:'',
    pin: '', pinDegistirildi: false, pinDeneme: 0, pinKilit: 0
  });
}
var SEED_AIDAT = {};
SEED_APARTMENTS.forEach(function(a){ SEED_AIDAT[BLOK_ADI + a.daire] = new Array(12).fill(''); });
var AY_ADLARI = ['OCAK','ŞUBAT','MART','NİSAN','MAYIS','HAZİRAN','TEMMUZ','AĞUSTOS','EYLÜL','EKİM','KASIM','ARALIK'];
var DEFAULT_AIDAT_TUTAR = 750;
var DEFAULT_SABLONLAR = {
  borcHatirlatma: "Sayin {ISIM} ({DAIRE}),\n\nSirkinti Evleri yonetimi olarak bilgilendiriyoruz:\n\nAIDAT DURUMU\n- Odenen: {AIDAT_ODENEN}\n- Kalan Borc: {AIDAT_BORC}\n\nDEMIRBAS DURUMU\n- Odenen: {DEMIRBAS_ODENEN}\n- Kalan Borc: {DEMIRBAS_BORC}\n{ALACAK_SATIR}\nTOPLAM BEKLENEN: {TOPLAM_BORC}\n\nOdemenizi en kisa surede yapmanizi rica ederiz.\nIyi gunler dileriz.\n- Site Yonetimi",
  borcYok: "Sayin {ISIM} ({DAIRE}),\n\nSirkinti Evleri yonetimi olarak bilgilendiriyoruz:\n\nOdemeniz bulunmamaktadir. Duyarliliginiz icin tesekkur ederiz.\n{ALACAK_SATIR}\nIyi gunler dileriz.\n- Site Yonetimi",
  ozelDuyuru: "Sayin {ISIM} ({DAIRE}),\n\n{ICERIK}\n\n- Site Yonetimi"
};

// ============================================================
// YARDIMCI FONKSİYONLAR
// ============================================================
function esc(s){
  return String(s==null?'':s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function isOdenmediVal(v){
  if(!v) return false;
  var s = String(v).toUpperCase()
    .replace(/Ö/g,'O').replace(/Ü/g,'U').replace(/İ/g,'I')
    .replace(/Ş/g,'S').replace(/Ç/g,'C').replace(/Ğ/g,'G');
  return s === 'ODENMEDI';
}
function isMuafVal(v){
  if(!v) return false;
  var s = String(v).toUpperCase()
    .replace(/Ö/g,'O').replace(/Ü/g,'U').replace(/İ/g,'I')
    .replace(/Ş/g,'S').replace(/Ç/g,'C').replace(/Ğ/g,'G');
  return s === 'MUAF';
}
function isEskiVal(v){
  if(!v) return false;
  var s = String(v).toUpperCase();
  return s.indexOf('ESKI') > -1 || s.indexOf('ESKİ') > -1;
}

// ============================================================
// PIN YARDIMCI FONKSİYONLARI
// ============================================================
function varsayilanPin(daire){
  if(!daire) return '';
  var tel = String(daire.telefon||'').replace(/\D/g,'');
  if(tel.length < 4) return '';
  return tel.slice(-4);
}
function gecerliPin(daire){
  if(!daire) return '';
  if(daire.pin && String(daire.pin).length === 4) return String(daire.pin);
  return varsayilanPin(daire);
}
function pinKontrol(daire, girilenPin){
  var gp = String(girilenPin||'').trim();
  if(gp.length !== 4 || !/^\d{4}$/.test(gp)) return false;
  return gecerliPin(daire) === gp;
}
function pinKilitliMi(daire){
  return (daire.pinKilit||0) > Date.now();
}
function pinHataliDene(daire){
  daire.pinDeneme = (daire.pinDeneme || 0) + 1;
  if(daire.pinDeneme >= 5){
    daire.pinKilit = Date.now() + (15 * 60 * 1000);
    daire.pinDeneme = 0;
  }
}
function pinBasarili(daire){
  daire.pinDeneme = 0;
  daire.pinKilit = 0;
}

// ============================================================
// DB YÖNETİMİ
// ============================================================
function loadLocalDB(){
  try{
    var raw = localStorage.getItem(STORAGE_KEY);
    if(raw){ return JSON.parse(raw); }
  }catch(e){ console.warn('Local load error:', e); }
  return null;
}

function getAidatTutar(){ return (db.settings && db.settings.aidatTutar) || DEFAULT_AIDAT_TUTAR; }
function getToplamBekle(){ return getAidatTutar() * 12; }
function fmtMoney(n){
  var v = Number(n)||0;
  try{ return v.toLocaleString('tr-TR',{minimumFractionDigits: v%1?2:0, maximumFractionDigits:2})+' TL'; }
  catch(e){ return v + ' TL'; }
}
function fmtDate(s){
  if(!s) return '-';
  try{
    var d = new Date(s);
    if(isNaN(d.getTime())) return String(s);
    return String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+d.getFullYear();
  }catch(e){ return String(s); }
}
function aptKey(a){ return a.blok + a.daire; }
function getApt(k){
  if(!k) return null;
  return db.apartments.find(function(a){ return aptKey(a) === String(k); });
}
function tumDaireKodlari(){ return db.apartments.map(function(a){ return aptKey(a); }); }
function bugun(){ return new Date().toISOString().slice(0,10); }

function hucreTutar(v){
  if(v === undefined || v === null || v === '') return 0;
  if(isMuafVal(v) || isOdenmediVal(v)) return 0;
  if(typeof v === 'number') return v > 0 ? v : 0;
  var n = Number(v);
  if(!isNaN(n) && n > 0) return n;
  return 0;
}
function aidatOdenen(k){
  var row = db.aidat[k] || [];
  return row.reduce(function(s,v){ return s + hucreTutar(v); }, 0);
}
function aidatKalanFazlaOncesi(k){
  var row = db.aidat[k] || [];
  if(row.some(function(v){ return isMuafVal(v); })) return 0;
  return Math.max(0, getToplamBekle() - aidatOdenen(k));
}
function fazlaOdemesi(k){ return db.fazlaOdemeler[k] || 0; }
function aidatKalan(k){
  var h = aidatKalanFazlaOncesi(k);
  var f = fazlaOdemesi(k);
  return Math.max(0, h - f);
}
function aidatDurum(k){
  var row = db.aidat[k] || [];
  if(row.some(function(v){ return isMuafVal(v); })) return 'muaf';
  var fazla = db.fazlaOdemeler[k] || 0;
  if(fazla > 0 && aidatKalanFazlaOncesi(k) === 0) return 'alacakli';
  var kalan = aidatKalan(k);
  if(kalan === 0 && aidatOdenen(k) > 0) return 'paid';
  if(kalan === 0 && aidatOdenen(k) === 0) return 'empty';
  if(aidatOdenen(k) > 0) return 'partial';
  return 'unpaid';
}
function demirbasOdenen(k){ return (db.demirbas[k] && db.demirbas[k].odenen) || 0; }
function demirbasToplamOdenen(k){
  var t = demirbasOdenen(k);
  db.demirbasProjeler.forEach(function(p){ t += (p.odemeler[k]||0); });
  return t;
}
function demirbasToplamBorc(k){
  var t = 0;
  var d = db.demirbas[k];
  if(d) t += Math.max(0, (d.nefestenKalan||0) - (d.odenen||0));
  db.demirbasProjeler.forEach(function(p){
    if(p.secilenDaireler.indexOf(k) > -1){
      var od = p.odemeler[k]||0;
      t += Math.max(0, p.daireBasi - od);
    }
  });
  return t;
}
function bankaBaki(){ return Number(db.bankaBakiyesi)||0; }
function bankaBakiEkle(tutar){
  var t = Number(tutar)||0;
  if(t === 0) return;
  db.bankaBakiyesi = (Number(db.bankaBakiyesi)||0) + t;
}
function bankaBakiDus(tutar){

  if(t === 0) return;
  db.bankaBakiyesi = (Number(db.bankaBakiyesi)||0) - t;
}
function toplamGider(){ return db.giderler.reduce(function(s,g){ return s+(Number(g.tutar)||0); },0); }
function toplamAidatBorc(){

}
function toplamDemirbasBorc(){

}
function toplamAidatOdenen(){

}
function toplamBankaGelir(){

}
function daireBankaHareketleri(k){

}
function daireBankaToplam(k){

}
function telToWhatsApp(tel){
  if(!tel) return '';
  var t = String(tel).replace(/\D/g,'');
  if(!t) return '';
  if(t.startsWith('90') && t.length >= 12) return t;
  if(t.startsWith('0')) return '90'+t.slice(1);
  if(t.length === 10) return '90'+t;
  return t;
}
function telGecerliMi(tel){
  if(!tel) return false;
  var t = String(tel).trim();
  if(t === '' || t === 'BİLİNMİYOR' || t === 'BILINMIYOR') return false;
  return t.replace(/\D/g,'').length >= 10;
}
function telNormalize(tel){ if(!tel) return ''; return String(tel).replace(/\D/g,''); }
function telefonEslestiMi(a1, a2){
  var a = telNormalize(a1), b = telNormalize(a2);
  if(!a || !b) return false;
  if(a === b) return true;
  if(a.length >= 10 && b.length >= 10) return a.slice(-10) === b.slice(-10);
  return false;
}

function sablonDoldur(sablon, daireKodu){

      .split('{ISIM}').join(a ? (a.isim||'Sakin') : 'Sakin')

      .split('{AIDAT_BORC}').join(fmtMoney(aidatBorc))
      .split('{DEMIRBAS_ODENEN}').join(fmtMoney(demirbasToplamOdenen(daireKodu)))

async function pdfMetinCikar(file){
  if(!window.pdfjsLib) throw new Error('PDF kutuphanesi yuklenemedi');
  if(!window.pdfjsLib.GlobalWorkerOptions.workerSrc){
    window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  }
  var arrayBuffer = await file.arrayBuffer();
  var pdf = await window.pdfjsLib.getDocument({data: arrayBuffer}).promise;
  var tumMetin = [];
  for(var p = 1; p <= pdf.numPages; p++){
    var page = await pdf.getPage(p);
    var textContent = await page.getTextContent();
    var items = textContent.items.map(function(it){ return { str: it.str, x: it.transform[4], y: it.transform[5] }; });
    var satirlar = {};
    items.forEach(function(it){
      var yv = Math.round(it.y / 4) * 4;
      if(!satirlar[yv]) satirlar[yv] = [];
      satirlar[yv].push(it);
    });
    var yKeys = Object.keys(satirlar).map(Number).sort(function(a,b){ return b - a; });
    yKeys.forEach(function(y){
      var kelimeler = satirlar[y].sort(function(a,b){ return a.x - b.x; });
      var satirItems = kelimeler.map(function(w){ return { str: w.str, x: w.x }; });
      var satir = satirItems.map(function(w){ return w.str; }).join(' ').trim();
      if(satir) tumMetin.push({ metin: satir, items: satirItems });
    });
  }
  return tumMetin;
}

// ============================================================
// AIDAT PDF PARSE — "+" = ÖDENDİ, sayı = ÖDENMEDİ
// ============================================================
function parseAidatPDF(satirlar){
  var sonuc = [];
  satirlar.forEach(function(satirObj){
    try{
      var satirMetni = satirObj.metin || '';
      var items = satirObj.items || [];
      if(!satirMetni) return;

      if(satirMetni.indexOf('DAİRE') > -1 && satirMetni.indexOf('ADI') > -1) return;
      if(satirMetni.indexOf('GÜNCELLEME') > -1) return;
      if(satirMetni.toUpperCase().indexOf('TOPLAM') > -1 && satirMetni.toUpperCase().indexOf('AY') > -1) return;

      var mDaire = satirMetni.match(/^(\d{1,2})\s+/);
      if(!mDaire) return;
      var daire = Number(mDaire[1]);
      if(daire < 1 || daire > TOPLAM_DAIRE) return;

      var baslangicIdx = 0;
      for(var i = 0; i < items.length; i++){
        var t = (items[i].str||'').trim();
        if(t === String(daire)){ baslangicIdx = i + 1; break; }
      }
      var kalan = items.slice(baslangicIdx);

      var isimParcalari = [];
      var idx = 0;
      while(idx < kalan.length){
        var s = (kalan[idx].str||'').trim();
        if(!s){ idx++; continue; }
        if(s === '+' || s === '✓' || s === '✔' || s === '√' || s === 'V' || s === 'v') break;
        if(/^\d+([.,]\d+)?$/.test(s)) break;
        if(s === 'Borcuy' || s === 'Borclu' || s === 'BORCLU' || s === 'BORCUY' || s === 'Yok' || s === 'YOK') break;
        if(isAidatDurumKelimesi(s)) break;
        if(/[A-Za-zÇĞİÖŞÜçğıöşü]/.test(s)){
          isimParcalari.push(s);
          idx++;
        } else { idx++; }
      }
      var isim = isimParcalari.join(' ').trim();

      var aylikDeger = new Array(12).fill('');
      var odenenTutar = 0;
      var borcluTutar = 0;
      var ayIdx = 0;

      while(idx < kalan.length && ayIdx < 12){
        var s = (kalan[idx].str||'').trim();
        if(!s){ idx++; continue; }

        if(s === '+' || s === '✓' || s === '✔' || s === '√' || s === 'V' || s === 'v'){
          aylikDeger[ayIdx] = 'ODENDI';
          odenenTutar += getAidatTutar();
          ayIdx++;
          idx++;
        }
        else if(/^\d+([.,]\d+)?$/.test(s)){
          var tutar = Number(String(s).replace(',','.'));
          if(!isNaN(tutar) && tutar > 0){
            aylikDeger[ayIdx] = 'ODENMEDI';
            borcluTutar += tutar;
            ayIdx++;
          }
          idx++;
        }
        else if(s === 'Borcuy' || s === 'Borclu' || s === 'BORCLU' || s === 'BORCUY' || s === 'Yok' || s === 'YOK'){
          idx++;
        }
        else { idx++; }
      }

      var satirTamami = satirMetni.toLowerCase();
      if((satirTamami.indexOf('borcuy yok') > -1 || satirTamami.indexOf('borclu yok') > -1) &&
         aylikDeger.every(function(v){ return v === ''; })){
        for(var z = 0; z < 12; z++){
          aylikDeger[z] = 'ODENDI';
          odenenTutar += getAidatTutar();
        }
      }

      sonuc.push({
        daire: daire, isim: isim, aylikDeger: aylikDeger,
        odenenTutar: odenenTutar, borcluTutar: borcluTutar, ham: satirMetni
      });
    }catch(e){ console.warn('parseAidatPDF satir hatasi:', e); }
  });
  return sonuc;
}

function isAidatDurumKelimesi(s){
  var norm = String(s).toUpperCase()
    .replace(/Ö/g,'O').replace(/Ü/g,'U').replace(/İ/g,'I')
    .replace(/Ş/g,'S').replace(/Ç/g,'C').replace(/Ğ/g,'G');
  return norm === 'ODENDI' || norm === 'ODENMEDI' || norm === 'MUAF' ||
         norm === 'OCAK' || norm === 'SUBAT' || norm === 'MART' ||
         norm === 'NISAN' || norm === 'MAYIS' || norm === 'HAZIRAN' ||
         norm === 'TEMMUZ' || norm === 'AGUSTOS' || norm === 'EYLUL' ||
         norm === 'EKIM' || norm === 'KASIM' || norm === 'ARALIK';
}

function parseIcmalPDF(satirlar){
  var sonuc = { gelirler: [], giderler: [] };
  satirlar.forEach(function(satirObj){
    try{
      var satir = (satirObj.metin || satirObj).toString().trim();
      if(!satir) return;
      var m = satir.match(/^(\d{1,3})\s*(\d{2}\.\d{2}\.\d{4})\s*(-?)\s*(\d{1,2})?\s*(\d+)\s+(.+)$/);
      if(!m) return;
      var tarih = m[2];
      var negatif = m[3] === '-';
      var olasiDaire = m[4] ? Number(m[4]) : null;
      var tutar = Number(m[5]);
      var kalanMetin = m[6].trim();
      var isim = kalanMetin, daire = null;
      var mD = kalanMetin.match(/^(\d{1,2})\s+(.+)/);
      if(mD && Number(mD[1]) >= 1 && Number(mD[1]) <= 30){ daire = Number(mD[1]); isim = mD[2]; }
      else if(olasiDaire && olasiDaire >= 1 && olasiDaire <= 30){ daire = olasiDaire; }
      var kayit = { tarih: tarih, tutar: tutar, isim: isim, daire: daire, aciklama: kalanMetin };
      if(negatif) sonuc.giderler.push(kayit);
      else sonuc.gelirler.push(kayit);
    }catch(e){ /* skip */ }
  });
  return sonuc;
}

function parseEnparaPDF(satirlar){
  var sonuc = [];
  satirlar.forEach(function(satirObj){
    try{
      var satir = (satirObj.metin || satirObj).toString().trim();
      if(!satir) return;
      var m = satir.match(/^(\d{2}\.\d{2}\.\d{4})\s*(Gelen Transfer|Giden Transfer|Ödeme|Para Çekme|Gelen Havale|Giden Havale)\s+(.+?)\s+(-?[\d.]+,\d{2})\s*TL\s+([\d.]+,\d{2})\s*TL$/);
      if(!m) return;
      var tarih = m[1];
      var tip = m[2];
      var aciklamaTum = m[3].trim();
      var tutarRaw = m[4].replace(/\./g,'').replace(',','.');
      var tutar = Math.abs(Number(tutarRaw));
      var negatif = m[4].startsWith('-') || tip.indexOf('Giden') > -1 || tip === 'Ödeme';
      var bakiye = Number(m[5].replace(/\./g,'').replace(',','.'));
      var isim = '', aciklama = aciklamaTum;
      var virgulIdx = aciklamaTum.indexOf(',');
      if(virgulIdx > 0){ isim = aciklamaTum.substring(0, virgulIdx).trim(); aciklama = aciklamaTum.substring(virgulIdx+1).trim(); }
      else isim = aciklamaTum.substring(0, 30).trim();
      var daire = null;
      var mD = aciklama.match(/(?:daire|no|kat|D|K)[\s:]*(\d{1,2})/i);
      if(mD) daire = Number(mD[1]);
      sonuc.push({ tarih: tarih, tip: tip, isim: isim, aciklama: aciklama, tutar: tutar, bakiye: bakiye, daire: daire, gelir: !negatif, gider: negatif });
    }catch(e){ /* skip */ }
  });
  return sonuc;
}

async function excelDaireAktar(file){
  if(!window.XLSX) throw new Error('Excel kutuphanesi yuklenemedi');
  var arrayBuffer = await file.arrayBuffer();
  var wb = XLSX.read(arrayBuffer, {type:'array'});
  var sheet = wb.Sheets[wb.SheetNames[0]];
  var rows = XLSX.utils.sheet_to_json(sheet, {header:1, raw:false, defval:''});
  var yeniDaireler = [];
  if(!rows || !rows.length) return yeniDaireler;
  var baslangic = 0;
  var ilk = (rows[0]||[]).map(function(c){ return String(c).toLowerCase(); }).join(' ');
  if(ilk.indexOf('isim')>-1 || ilk.indexOf('ad')>-1 || ilk.indexOf('daire')>-1 || ilk.indexOf('blok')>-1) baslangic = 1;
  for(var r = baslangic; r < rows.length; r++){
    var row = rows[r] || [];
    if(!row.length) continue;
    var daireNo = null, isim = '', telefon = '', plaka = '';
    row.forEach(function(cell){
      var c = String(cell||'').trim();
      if(!c) return;
      if(daireNo === null && /^\d{1,3}$/.test(c) && Number(c) >= 1 && Number(c) <= 30){ daireNo = Number(c); return; }
      if(!telefon && /^[0-9\s\-\(\)\+]{10,}$/.test(c) && c.replace(/\D/g,'').length >= 10){ telefon = c; return; }
      if(!plaka && /^\d{2}\s?[A-Z]{1,3}\s?\d{2,4}$/i.test(c)){ plaka = c; return; }
      if(!isim && c.length >= 4 && c.split(/\s+/).length >= 2 && !/^\d+$/.test(c)){ isim = c.toUpperCase(); return; }
    });
    if(daireNo && isim){ yeniDaireler.push({ blok: BLOK_ADI, daire: daireNo, isim: isim, telefon: telefon, plaka: plaka, evsahibi: '', evTel: '' }); }
  }
  return yeniDaireler;
}

function setSyncStatus(status, msg){
  try{
    var bar = document.getElementById('syncBar');
    var st = document.getElementById('syncStatus');
    if(!bar || !st) return;
    bar.className = '';
    if(status === 'saving'){ bar.classList.add('saving'); st.textContent = msg||'Kaydediliyor...'; st.classList.add('show'); }
    else if(status === 'saved'){
      bar.classList.add('saved'); st.textContent = 'Buluta kaydedildi'; st.classList.add('show');
      setTimeout(function(){ st.classList.remove('show'); }, 1500);
      setTimeout(function(){ bar.className=''; }, 1500);
    }
    else if(status === 'error'){ bar.classList.add('error'); st.textContent = (msg||'Baglanti hatasi'); st.classList.add('show'); }
  }catch(e){ /* skip */ }
}

function saveToCloud(){
  if(!_fbReady || !_setDoc || !isAdmin) return;
  setSyncStatus('saving');
  clearTimeout(_fbSaveTimer);
  _fbSaveTimer = setTimeout(async function(){
    try{
      await _setDoc(_doc(_fs, FIRESTORE_COLLECTION, FIRESTORE_DOC), JSON.parse(JSON.stringify(db)));
      setSyncStatus('saved');
    }catch(e){
      console.error('Firebase save error:', e);
      setSyncStatus('error', e.message);
    }
  }, 600);
}

function saveDBForce(){

  }
}

async function loadFromCloud(){
  if(!_getDoc || !_doc || !_fs) return false;
  try{
    var ref = _doc(_fs, FIRESTORE_COLLECTION, FIRESTORE_DOC);
    var snap = await _getDoc(ref);
    if(snap.exists()){
      var cloudData = snap.data();
      if(cloudData && cloudData.apartments && cloudData.apartments.length){
        db = cloudData;
        if(!db.fazlaOdemeler) db.fazlaOdemeler = {};
        if(!db.islemler) db.islemler = [];
        if(!db.bankaHareketleri) db.bankaHareketleri = [];
        if(!db.demirbasProjeler) db.demirbasProjeler = [];
        if(db.bankaBakiyesi === undefined) db.bankaBakiyesi = KASA_BASLANGIC_VARSAYILAN;
        if(!db.sablonlar) db.sablonlar = JSON.parse(JSON.stringify(DEFAULT_SABLONLAR));
        if(!db.bildirimGecmisi) db.bildirimGecmisi = [];
        if(!db.settings) db.settings = { aidatTutar: DEFAULT_AIDAT_TUTAR };
        if(!db.settings.aidatTutar || db.settings.aidatTutar <= 0) db.settings.aidatTutar = DEFAULT_AIDAT_TUTAR;
        if(db.apartments.length < TOPLAM_DAIRE){
          for(var ii = db.apartments.length + 1; ii <= TOPLAM_DAIRE; ii++){
            db.apartments.push({blok:BLOK_ADI, daire:ii, isim:'', telefon:'', plaka:'', evsahibi:'', evTel:'', pin:'', pinDegistirildi:false, pinDeneme:0, pinKilit:0});
          }
        }
        db.apartments.forEach(function(a){
          if(!a.blok) a.blok = BLOK_ADI;
          if(a.pin === undefined) a.pin = '';
          if(a.pinDegistirildi === undefined) a.pinDegistirildi = false;
          if(a.pinDeneme === undefined) a.pinDeneme = 0;
          if(a.pinKilit === undefined) a.pinKilit = 0;
          var kk = a.blok + a.daire;
          if(!db.aidat[kk]) db.aidat[kk] = new Array(12).fill('');
        });
        saveLocalDB(db); window.db = db;
      } else {
        await _setDoc(ref, JSON.parse(JSON.stringify(db)));
      }
    } else {
      await _setDoc(ref, JSON.parse(JSON.stringify(db)));
    }
    return true;
  }catch(e){
    console.error('Firebase load error:', e);
    return false;
  }
}

function startRealtimeSync(){
  if(!_onSnapshot || !_doc || !_fs) return;
  try{
    var ref = _doc(_fs, FIRESTORE_COLLECTION, FIRESTORE_DOC);
    var first = true;
    _onSnapshot(ref, function(snap){
      try{
        if(first){ first = false; return; }
        if(snap.exists()){
          var cloudData = snap.data();
          if(JSON.stringify(db) !== JSON.stringify(cloudData)){
            db = cloudData;
            if(!db.islemler) db.islemler = [];
            if(!db.bankaHareketleri) db.bankaHareketleri = [];
            saveLocalDB(db);
            window.db = db;
            if(!_modalOpen) safeRender();
          }
        }
      }catch(err){ console.error('onSnapshot handler error:', err); }
    });
  }catch(e){ console.warn('Realtime sync error:', e); }
}

    var fbApp = appMod.initializeApp(firebaseConfig);
    _fs = fsMod.getFirestore(fbApp);

async function adminLogin(email, pass){
  if(!_signInWithEmailAndPassword || !_auth) return { ok:false, msg:'Firebase hazir degil. Lutfen bekleyin.' };
  try{
    await _signInWithEmailAndPassword(_auth, email, pass);
    return { ok: true };
  }catch(e){
    var msg = 'Giris basarisiz.';
    if(e.code === 'auth/wrong-password') msg = 'Sifre hatali.';
    else if(e.code === 'auth/user-not-found') msg = 'Bu e-posta ile kayitli kullanici yok.';
    else if(e.code === 'auth/invalid-email') msg = 'Gecersiz e-posta adresi.';
    else if(e.code === 'auth/too-many-requests') msg = 'Cok fazla deneme. Lutfen bekleyin.';
    else if(e.code === 'auth/invalid-credential') msg = 'E-posta veya sifre hatali.';
    else if(e.code === 'auth/unauthorized-domain') msg = 'Bu domain yetkili degil.';
    return { ok: false, msg: msg };
  }
}

function safeRender(){
  if(_renderInProgress){ return; }
  _renderInProgress = true;
  try{
    render();
  }catch(e){
    console.error('RENDER ERROR:', e);
    try{
      var app = document.getElementById('app');
      if(app){
        app.innerHTML = '<div class="err-box"><b>Bir hata olustu:</b><br>'+esc(e.message||String(e))+'<br><br>'
          + '<button class="btn btn-primary" onclick="location.reload()">Sayfayi Yenile</button></div>';
      }
    }catch(err2){ console.error('Fallback render error:', err2); }
  }finally{

  }
}

function navTo(page){
  try{
    if(page === 'login'){ currentPage = 'login'; safeRenderNav(); safeRender(); window.scrollTo(0,0); return; }
    if(page === 'sakin-login'){ currentPage = 'sakin-login'; safeRenderNav(); safeRender(); window.scrollTo(0,0); return; }
    if(page === 'sakin-pin-degistir'){ 
      if(!sakinDaireKodu) return;
      currentPage = 'sakin-pin-degistir'; safeRenderNav(); safeRender(); window.scrollTo(0,0); return; 
    }
    if(page === 'sakin-home'){
      if(!sakinDaireKodu) return;
      currentPage = 'sakin-home'; safeRenderNav(); safeRender(); window.scrollTo(0,0); return;
    }
    if(!isAdmin && page !== 'home') return;
    currentPage = page; safeRenderNav(); safeRender(); window.scrollTo(0,0);
  }catch(e){ console.error('navTo error:', e); }
}

function render(){
  var app = document.getElementById('app');
  if(!app) return;
  var html = '';
  if(currentPage === 'login'){ html = viewLogin(); }
  else if(currentPage === 'sakin-login'){ html = viewSakinLogin(); }
  else if(currentPage === 'sakin-pin-degistir'){ html = viewPinDegistir(); }
  else if(currentPage === 'sakin-home'){ html = viewSakinHome(); }
  else {
    switch(currentPage){
      case 'home': html = viewHome(); break;
      case 'apartments': html = viewApartments(); break;
      case 'aidat': html = viewAidat(); break;
      case 'demirbas': html = viewDemirbas(); break;
      case 'eski': html = viewEski(); break;
      case 'gider': html = viewGider(); break;
      case 'islemler': html = viewIslemler(); break;
      case 'duyurular': html = viewDuyurular(); break;
      case 'bildirimler': html = viewBildirimler(); break;
      case 'sablonlar': html = viewSablonlar(); break;
      case 'icmal': html = viewIcmal(); break;
      default: html = viewHome();
    }
  }
  app.innerHTML = html;
}

function sakinLoginSubmit(){
  try{
    var daire = document.getElementById('sakinDaire').value;
    var tel = document.getElementById('sakinTel').value.trim();
    var pin = document.getElementById('sakinPin').value.trim();
    var errEl = document.getElementById('sakinErr');
    errEl.innerHTML = '';
    
    if(!daire || !tel){ errEl.innerHTML = '<div class="login-err">Daire ve telefon numarasi gerekli.</div>'; return; }
    if(!pin || pin.length !== 4){ errEl.innerHTML = '<div class="login-err">4 haneli PIN kodu gerekli.</div>'; return; }
    
    var a = getApt(daire);
    if(!a){ errEl.innerHTML = '<div class="login-err">Bu daire bulunamadi.</div>'; return; }
    
    if(pinKilitliMi(a)){
      var kalanDk = Math.ceil((a.pinKilit - Date.now()) / 60000);
      errEl.innerHTML = '<div class="login-err">⛔ Cok fazla hatali deneme. '+kalanDk+' dakika sonra tekrar deneyin.</div>';
      return;
    }
    
    if(!telGecerliMi(a.telefon)){ errEl.innerHTML = '<div class="login-err">Bu dairenin sistemde kayitli telefon numarasi yok.</div>'; return; }
    if(!telefonEslestiMi(a.telefon, tel)){ errEl.innerHTML = '<div class="login-err">Girdiginiz telefon numarasi eslesmiyor.</div>'; return; }
    
    if(!pinKontrol(a, pin)){
      pinHataliDene(a);
      saveLocalDB(db);
      var kalanHak = 5 - (a.pinDeneme||0);
      if(pinKilitliMi(a)){
        errEl.innerHTML = '<div class="login-err">⛔ Cok fazla hatali deneme. 15 dakika kilitlendi.</div>';
      } else {
        errEl.innerHTML = '<div class="login-err">❌ PIN kodu hatali. Kalan hak: '+kalanHak+'</div>';
      }
      return;
    }
    
    pinBasarili(a);
    saveLocalDB(db);
    sakinDaireKodu = daire;
    sessionStorage.setItem('sakin_daire', daire);
    
    if(!a.pinDegistirildi){
      currentPage = 'sakin-pin-degistir';
    } else {
      currentPage = 'sakin-home';
    }
    safeRenderNav();
    safeRender();
    window.scrollTo(0,0);
  }catch(e){
    console.error('sakinLoginSubmit error:', e);
    var el = document.getElementById('sakinErr');
    if(el) el.innerHTML = '<div class="login-err">'+esc(e.message)+'</div>';
  }
}

function kaydetApt(k){
  if(!isAdmin) return;
  try{
    var a = getApt(k); if(!a) return;
    var t = document.getElementById('f_telefon').value.trim();
    a.isim = document.getElementById('f_isim').value.trim();
    a.telefon = t;
    a.plaka = document.getElementById('f_plaka').value.trim();
    a.evsahibi = document.getElementById('f_evsahibi').value.trim();
    a.evTel = document.getElementById('f_evtel').value.trim();
    var dO = document.getElementById('f_demirOdenen');
    if(dO){
      if(!db.demirbas[k]) db.demirbas[k] = {nefestenKalan:0, odenen:0};
      var eskiOdenen = db.demirbas[k].odenen || 0;
      var yeniOdenen = Number(dO.value)||0;
      var fark = yeniOdenen - eskiOdenen;
      if(fark > 0){ bankaBakiEkle(fark); } else if(fark < 0){ bankaBakiDus(-fark); }
      db.demirbas[k].odenen = yeniOdenen;
    }
    saveDB(); closeModal(); safeRender();
    alert('✅ Kaydedildi.' + (telGecerliMi(t) ? '\nWhatsApp listesinde.' : ''));
  }catch(e){
    console.error('kaydetApt error:', e);
    alert('Kayit hatasi: '+e.message);
  }
}

function fazlaDus(k){
  if(!isAdmin) return;
  try{
    var tutar = Number(document.getElementById('f_fazlaDus').value)||0;
    if(tutar <= 0){ alert('Tutar girin'); return; }
    var mevcut = fazlaOdemesi(k);
    if(tutar > mevcut){ alert('Fazla odemeden fazla dusemezsiniz.'); return; }
    db.fazlaOdemeler[k] = mevcut - tutar;
    if(db.fazlaOdemeler[k] <= 0) delete db.fazlaOdemeler[k];
    saveDB(); closeModal(); safeRender();
    alert('✅ '+fmtMoney(tutar) + ' fazla odemeden dusuldu.');
  }catch(e){ console.error(e); }
}

function bhKaydet(k, editId){
  if(!isAdmin) return;
  try{
    var tarihRaw = document.getElementById('bh_tarih').value;
    var tarih = tarihRaw ? tarihRaw.split('-').reverse().join('.') : bugun().split('-').reverse().join('.');
    var isim = document.getElementById('bh_isim').value.trim();
    var tutar = Number(document.getElementById('bh_tutar').value)||0;
    var aciklama = document.getElementById('bh_aciklama').value.trim();
    if(!isim){ alert('Isim gerekli'); return; }
    if(tutar <= 0){ alert('Gecerli tutar girin'); return; }
    if(editId){
      var h = db.bankaHareketleri.find(function(x){ return x.id === editId; });
      if(h){ h.tarih = tarih; h.isim = isim; h.tutar = tutar; h.aciklama = aciklama; }
    } else {
      db.bankaHareketleri.push({ id: 'bh_' + Date.now() + '_' + Math.random().toString(36).slice(2,6), daire: k, tarih: tarih, isim: isim, tutar: tutar, aciklama: aciklama });
    }
    saveDB(); closeModal(); aptDetay(k);
    alert('✅ Kaydedildi.');
  }catch(e){ console.error(e); alert('Hata: '+e.message); }
}

    body += '<div class="sec-title">Odeme Durumu</div>'
      + '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px">'
      + '<button class="btn '+(sayisal && Number(curStr)===AIDAT_TUTAR?'btn-success':'')+'" onclick="aidatSec(\'odendi\')" style="grid-column:span 2">✅ Odendi ('+AIDAT_TUTAR+' TL)</button>'
      + '<button class="btn '+(sayisal && Number(curStr)!==AIDAT_TUTAR?'btn-success':'')+'" onclick="aidatSec(\'tutar\')" style="grid-column:span 2">💵 Manuel Tutar</button>'
      + '<button class="btn '+(isOdenmedi?'btn-danger':'')+'" onclick="aidatSec(\'odenmedi\')">❌ Odenmedi</button>'
      + '<button class="btn '+(isMuaf?'btn-success':'')+'" onclick="aidatSec(\'muaf\')">⚪ Muaf</button>'
      + '<button class="btn '+(isEski?'btn-success':'')+'" onclick="aidatSec(\'eski\')">👤 Eski Sakin</button>'
      + '<button class="btn" onclick="aidatSec(\'bos\')">➖ Bos</button>'
      + '</div>'
      + '<div id="tutarWrap" class="fg" style="display:none"><label>Tutar (TL)</label><input type="number" step="0.01" class="fc" id="aidatTutarInput" value="'+(sayisal?curStr:'')+'"></div>'
      + '<div id="eskiWrap" class="fg" style="'+(isEski?'':'display:none')+'"><label>Eski Sakin Turu</label><select class="fc" id="eskiTip">'
      + '<option '+(curStr==='ESKİ SAHİBİ'?'selected':'')+'>ESKİ SAHİBİ</option>'
      + '<option '+(curStr==='ESKİ KİRACI'?'selected':'')+'>ESKİ KİRACI</option></select></div>'
      + '<button class="btn btn-primary btn-block" style="margin-top:14px" onclick="saveAidat(\''+esc(k)+'\','+ayIndex+')">💾 Kaydet</button>';
    openModal(body);
    if(sayisal && Number(curStr)===AIDAT_TUTAR) window._aidatSec = 'odendi';
    else if(sayisal) window._aidatSec = 'tutar';
    else if(isOdenmedi) window._aidatSec = 'odenmedi';
    else if(isMuaf) window._aidatSec = 'muaf';
    else if(isEski) window._aidatSec = 'eski';
    else window._aidatSec = 'bos';
  }catch(e){ console.error('editAidat error:', e); }
}

function aidatSec(tip){
  window._aidatSec = tip;
  var tw = document.getElementById('tutarWrap');
  var ew = document.getElementById('eskiWrap');
  if(tw) tw.style.display = tip==='tutar'?'':'none';
  if(ew) ew.style.display = tip==='eski'?'':'none';
  if(tip === 'odendi'){ var inp = document.getElementById('aidatTutarInput'); if(inp) inp.value = getAidatTutar(); }
}

function saveAidat(k, ayIndex){
  if(!isAdmin) return;
  try{
    if(!db.aidat[k]) db.aidat[k] = new Array(12).fill('');
    var tip = window._aidatSec;
    if(!tip){ alert('Lutfen bir durum secin'); return; }
    var AIDAT_TUTAR = getAidatTutar();
    var eskiVal = db.aidat[k][ayIndex];
    var eskiTutar = hucreTutar(eskiVal);
    var val = '';
    var yeniTutar = 0;
    if(tip === 'odendi'){ yeniTutar = AIDAT_TUTAR; val = AIDAT_TUTAR; }
    else if(tip === 'tutar'){
      var t = Number(document.getElementById('aidatTutarInput').value)||0;
      if(t <= 0){ alert('Gecerli tutar girin'); return; }
      yeniTutar = t; val = t;
      if(t > AIDAT_TUTAR){
        var fazlaFark = t - AIDAT_TUTAR;
        db.fazlaOdemeler[k] = (db.fazlaOdemeler[k]||0) + fazlaFark;
        alert(fmtMoney(t)+' kaydedildi.\n'+fmtMoney(fazlaFark)+' fazla odeme.');
      } else alert(fmtMoney(t)+' kaydedildi.');
    }
    else if(tip === 'odenmedi') val = 'ÖDENMEDİ';
    else if(tip === 'muaf') val = 'MUAF';
    else if(tip === 'eski') val = document.getElementById('eskiTip').value;
    else val = '';
    var fark = yeniTutar - eskiTutar;
    if(fark > 0) bankaBakiEkle(fark);
    else if(fark < 0) bankaBakiDus(-fark);
    db.aidat[k][ayIndex] = val;
    saveDB(); closeModal(); aptDetay(k);
  }catch(e){ console.error('saveAidat error:', e); alert('Hata: '+e.message); }
}

      html += '<div class="card"><div class="card-title">🏗️ Aktif Projeler <span class="badge-cnt">'+db.demirbasProjeler.length+'</span></div>';
      db.demirbasProjeler.forEach(function(p){
        var toplamOdenen = 0;
        Object.keys(p.odemeler).forEach(function(k){ toplamOdenen += p.odemeler[k]; });
        var toplamBekle = p.secilenDaireler.length * p.daireBasi;
        var yuzde = toplamBekle? Math.round(toplamOdenen/toplamBekle*100) : 0;
        var odeyenSay = p.secilenDaireler.filter(function(k){ return (p.odemeler[k]||0)>=p.daireBasi; }).length;
        html += '<div class="proj-item"><h4>'+esc(p.baslik)+'</h4>'
          + '<div class="meta">'+fmtDate(p.tarih)+' - Toplam: <b>'+fmtMoney(p.toplam)+'</b> - Daire basi: <b>'+fmtMoney(p.daireBasi)+'</b></div>'
          + '<div class="meta">'+p.secilenDaireler.length+' daire - '+odeyenSay+' odedi</div>'
          + '<div class="bar"><div class="bar-fill" style="width:'+yuzde+'%"></div></div>'
          + '<div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap">'
          + '<button class="btn btn-sm btn-primary" onclick="projeDetay('+p.id+')">💰 Odeme / Detay</button>'
          + '<button class="btn btn-sm" onclick="projeDuzenleForm('+p.id+')">✏️ Duzenle</button>'
          + '<button class="btn btn-sm btn-danger" onclick="projeSil('+p.id+')">🗑️ Sil</button>'
          + '</div></div>';
      });
      html += '</div>';
    }
    html += '</div>';
    return html;
  }catch(e){
    console.error('viewDemirbas error:', e);
    return '<div class="err-box">Demirbas sayfasi yuklenirken hata: '+esc(e.message)+'</div>';
  }
}

var _geciciKalemler = [];
var _duzenlenenProjeId = null;

function yeniProjeForm(){
  if(!isAdmin) return;
  _geciciKalemler = [{ad:'',tutar:0}];
  _duzenlenenProjeId = null;
  renderProjeForm();
}

function projeDuzenleForm(id){
  if(!isAdmin) return;
  var p = db.demirbasProjeler.find(function(x){ return x.id===id; });
  if(!p) return;
  _geciciKalemler = p.kalemler.map(function(k){ return {ad:k.ad, tutar:k.tutar}; });
  _duzenlenenProjeId = id;
  renderProjeForm(p);
}

function secilenDaireler(){
  try{
    var r = document.querySelector('input[name="kapsam"]:checked');
    if(!r || r.value === 'tum') return tumDaireKodlari();
    var wrap = document.getElementById('aptSelectWrap');
    if(!wrap) return [];
    var checkedNodes = wrap.querySelectorAll('input[type="checkbox"]:checked');
    var arr = [];
    for(var i = 0; i < checkedNodes.length; i++){
      if(checkedNodes[i].value) arr.push(checkedNodes[i].value);
    }
    return arr;
  }catch(e){
    console.error('secilenDaireler error:', e);
    return tumDaireKodlari();
  }
}

function renderProjeForm(mevcutProje){
  try{
    var p = mevcutProje || null;
    var toplam = 0;
    _geciciKalemler.forEach(function(k){ toplam += Number(k.tutar)||0; });
    var seciliSay = p ? p.secilenDaireler.length : TOPLAM_DAIRE;
    var daireBasi = seciliSay ? toplam/seciliSay : 0;
    var body = '<h2>'+(p?'✏️ Projeyi Duzenle':'🏗️ Yeni Demirbas Projesi')+'</h2>'
      + '<div class="fg"><label>Baslik</label><input class="fc" id="p_baslik" placeholder="Orn: Asansor Motor Degisimi" value="'+esc(p?p.baslik:'')+'"></div>'
      + '<div class="sec-title">Kalemler</div><div id="kalemList">';
    _geciciKalemler.forEach(function(k, idx){
      body += '<div class="kalem-row">'
        + '<input class="fc" placeholder="Kalem adi" value="'+esc(k.ad||'')+'" oninput="kalemAdDegistir('+idx+', this.value)">'
        + '<input class="fc" type="number" step="0.01" placeholder="Tutar" value="'+(k.tutar||'')+'" style="max-width:110px" oninput="kalemTutarDegistir('+idx+', this.value)">'
        + '<button class="btn btn-sm btn-danger" onclick="kalemSil('+idx+')">🗑️</button></div>';
    });
    body += '</div>'
      + '<button class="btn btn-block" onclick="kalemEkle()">➕ Kalem Ekle</button>'
      + '<div class="divider"></div>'
      + '<div class="li"><div class="li-t">Toplam Tutar</div><div class="li-v" style="font-size:1.05rem" id="projeToplamVal">'+fmtMoney(toplam)+'</div></div>'
      + '<div class="divider"></div>';
    if(!p){
      body += '<div class="sec-title">Kime Yansitilacak?</div>'
        + '<div class="row" style="gap:8px;margin-bottom:8px">'
        + '<label class="apt-check on" id="tumChk" onclick="secTum();event.preventDefault()"><input type="radio" name="kapsam" value="tum" checked onchange="secTum()"> Tum '+TOPLAM_DAIRE+' daire</label>'
        + '<label class="apt-check" id="secChk" onclick="secSecili();event.preventDefault()"><input type="radio" name="kapsam" value="sec" onchange="secSecili()"> Belirli daireler</label>'
        + '</div>'
        + '<div id="aptSelectWrap" class="hidden"><div class="muted" style="margin-bottom:6px">Daire sec:</div><div class="apt-check-grid">';
      db.apartments.forEach(function(a){
        var kk = aptKey(a);
        body += '<label class="apt-check" id="chk_'+esc(kk)+'"><input type="checkbox" value="'+esc(kk)+'" onchange="toggleApt(\''+esc(kk)+'\')"> '+esc(kk)+'</label>';
      });
      body += '</div></div>';
    } else {
      body += '<div class="muted">Secili daire: <b>'+p.secilenDaireler.length+'</b></div>';
    }
    body += '<div class="divider"></div>'
      + '<div class="li"><div class="li-t">Daire Basina ('+seciliSay+' daire)</div><div class="li-v" id="dbVal">'+fmtMoney(daireBasi)+'</div></div>'
      + '<button class="btn btn-primary btn-block" style="margin-top:10px" onclick="projeKaydet()">💾 Kaydet</button>';
    openModal(body);
    if(!p) secTum();
  }catch(e){
    console.error('renderProjeForm error:', e);
    alert('Form acilamadi: '+e.message);
  }
}

function kalemAdDegistir(idx, val){ if(_geciciKalemler[idx]) _geciciKalemler[idx].ad = val; }
function kalemTutarDegistir(idx, val){
  if(_geciciKalemler[idx]) _geciciKalemler[idx].tutar = Number(val)||0;
  var toplam = 0;
  _geciciKalemler.forEach(function(k){ toplam += Number(k.tutar)||0; });
  var elToplam = document.getElementById('projeToplamVal');
  if(elToplam) elToplam.textContent = fmtMoney(toplam);
  updateDaireBasi();
}
function kalemSil(idx){
  _geciciKalemler.splice(idx, 1);
  renderProjeForm(_duzenlenenProjeId ? db.demirbasProjeler.find(function(x){ return x.id===_duzenlenenProjeId; }) : null);
}
function kalemEkle(){
  _geciciKalemler.push({ad:'', tutar:0});
  renderProjeForm(_duzenlenenProjeId ? db.demirbasProjeler.find(function(x){ return x.id===_duzenlenenProjeId; }) : null);
}

function secTum(){
  var tumChk = document.getElementById('tumChk');
  var secChk = document.getElementById('secChk');
  if(!tumChk || !secChk) return;
  tumChk.classList.add('on'); secChk.classList.remove('on');
  var wrap = document.getElementById('aptSelectWrap');
  if(wrap) wrap.classList.add('hidden');
  var r = document.querySelector('input[name="kapsam"][value="tum"]'); if(r) r.checked = true;
  updateDaireBasi();
}
function secSecili(){
  var tumChk = document.getElementById('tumChk');
  var secChk = document.getElementById('secChk');
  if(!tumChk || !secChk) return;
  tumChk.classList.remove('on'); secChk.classList.add('on');
  var wrap = document.getElementById('aptSelectWrap');
  if(wrap) wrap.classList.remove('hidden');
  var r = document.querySelector('input[name="kapsam"][value="sec"]'); if(r) r.checked = true;
  updateDaireBasi();
}
function toggleApt(k){
  var el = document.getElementById('chk_'+k);
  if(!el) return;
  var inp = el.querySelector('input');
  if(!inp) return;
  el.classList.toggle('on', inp.checked);
  updateDaireBasi();
}

function updateDaireBasi(){
  try{
    var toplam = 0;
    _geciciKalemler.forEach(function(k){ toplam += Number(k.tutar)||0; });
    var sec = secilenDaireler();
    var v = sec.length ? toplam/sec.length : 0;
    var el = document.getElementById('dbVal');
    if(el) el.textContent = fmtMoney(v);
  }catch(e){ console.error('updateDaireBasi error:', e); }
}

function projeKaydet(){
  if(!isAdmin) return;
  try{
    var baslik = document.getElementById('p_baslik').value.trim();
    if(!baslik){ alert('Baslik gerekli'); return; }
    var kalemler = _geciciKalemler.filter(function(k){ return (k.ad||'').trim() && k.tutar>0; });
    if(!kalemler.length){ alert('En az bir kalem gerekli'); return; }
    var toplam = 0;
    kalemler.forEach(function(k){ toplam += Number(k.tutar); });
    if(_duzenlenenProjeId){
      var p = db.demirbasProjeler.find(function(x){ return x.id===_duzenlenenProjeId; });
      if(!p) return;
      p.baslik = baslik;
      p.kalemler = kalemler.map(function(k){ return {ad:k.ad.trim(), tutar:Number(k.tutar)}; });
      p.toplam = toplam;
      p.daireBasi = toplam / p.secilenDaireler.length;
      saveDB(); closeModal(); safeRender();
      alert('✅ Guncellendi.');
    } else {
      var sec = secilenDaireler();
      if(!sec.length){ alert('En az bir daire secin'); return; }
      var daireBasi = toplam / sec.length;
      db.demirbasProjeler.push({ id: Date.now(), baslik: baslik, kalemler: kalemler.map(function(k){ return {ad:k.ad.trim(), tutar:Number(k.tutar)}; }), toplam: toplam, secilenDaireler: sec, daireBasi: daireBasi, tarih: bugun(), odemeler: {} });
      saveDB(); closeModal(); safeRender();
      alert('✅ Proje kaydedildi.\n\nToplam: '+fmtMoney(toplam)+'\nDaire basi: '+fmtMoney(daireBasi));
    }
    _duzenlenenProjeId = null;
  }catch(e){ console.error('projeKaydet error:', e); alert('Hata: '+e.message); }
}

function projeDetay(id){
  if(!isAdmin) return;
  try{
    var p = db.demirbasProjeler.find(function(x){ return x.id===id; });
    if(!p) return;
    var body = '<h2>🏗️ '+esc(p.baslik)+'</h2>'
      + '<div class="muted" style="margin-bottom:10px">'+fmtDate(p.tarih)+' - Daire basi: <b>'+fmtMoney(p.daireBasi)+'</b></div>'
      + '<div class="sec-title">Kalemler</div>';
    p.kalemler.forEach(function(k){ body += '<div class="li"><div class="li-t">'+esc(k.ad)+'</div><div class="li-v">'+fmtMoney(k.tutar)+'</div></div>'; });
    body += '<div class="li"><div class="li-t"><b>Toplam</b></div><div class="li-v"><b>'+fmtMoney(p.toplam)+'</b></div></div>'
      + '<div class="divider"></div><div class="sec-title">Odeme Durumu</div><div class="odemeli-list">';
    p.secilenDaireler.forEach(function(k){
      var a = getApt(k);
      var od = p.odemeler[k]||0;
      var kl = Math.max(0, p.daireBasi - od);
      var telVar = a && telGecerliMi(a.telefon);
      var cls = 'borc';
      if(kl === 0) cls = 'odendi';
      else if(od > 0) cls = 'kismi';
      body += '<div class="odeme-satir '+cls+'"><div class="ds-kod">'+esc(k)+'</div>'
        + '<div class="ds-isim">'+esc(a?(a.isim||'-'):'-')+'</div>'
        + '<div class="ds-tutar">'+od.toLocaleString('tr-TR')+' / '+p.daireBasi.toLocaleString('tr-TR')
        + (kl>0?'<br><span style="color:#c62828">'+kl.toLocaleString('tr-TR')+' kaldi</span>':'<br><span style="color:#2e7d32">✅ odendi</span>')+'</div>'
        + '<div class="ds-btn"><button class="btn btn-xs btn-success" onclick="odemeAlProje('+p.id+',\''+esc(k)+'\')">Al</button>'
        + (telVar?'<button class="btn btn-xs btn-wa" onclick="bildirimGonder(\''+esc(k)+'\')">💬</button>':'')+'</div></div>';
    });
    body += '</div><button class="btn btn-primary btn-block" style="margin-top:14px" onclick="closeModal()">Kapat</button>';
    openModal(body);
  }catch(e){ console.error('projeDetay error:', e); }
}

function odemeAlProje(projeId, k){
  if(!isAdmin) return;
  try{
    var p = db.demirbasProjeler.find(function(x){ return x.id===projeId; });
    if(!p) return;
    var mevcut = p.odemeler[k]||0;
    var kalan = Math.max(0, p.daireBasi - mevcut);
    var body = '<h2>💰 '+esc(k)+' - Odeme Al</h2>'
      + '<div class="li"><div class="li-t">Daire basi</div><div class="li-v">'+fmtMoney(p.daireBasi)+'</div></div>'
      + '<div class="li"><div class="li-t">Odenen</div><div class="li-v green">'+fmtMoney(mevcut)+'</div></div>'
      + '<div class="li"><div class="li-t">Kalan</div><div class="li-v red">'+fmtMoney(kalan)+'</div></div>'
      + '<div class="fg" style="margin-top:12px"><label>Alinacak Tutar (TL)</label><input class="fc" type="number" step="0.01" id="odTutar" value="'+kalan+'"></div>'
      + '<button class="btn btn-primary btn-block" onclick="odemeKaydetProje('+projeId+',\''+esc(k)+'\')">💾 Kaydet</button>'
      + '<button class="btn btn-block" style="margin-top:8px" onclick="projeDetay('+projeId+')">← Geri</button>';
    openModal(body);
  }catch(e){ console.error(e); }
}

function odemeKaydetProje(projeId, k){
  if(!isAdmin) return;
  try{
    var p = db.demirbasProjeler.find(function(x){ return x.id===projeId; });
    if(!p) return;
    var tutar = Number(document.getElementById('odTutar').value)||0;
    if(tutar <= 0){ alert('Tutar girin'); return; }
    var kalan = Math.max(0, p.daireBasi - (p.odemeler[k]||0));
    p.odemeler[k] = (p.odemeler[k]||0) + tutar;
    bankaBakiEkle(tutar);
    if(tutar > kalan){
      var fazlaTutar = tutar - kalan;
      db.fazlaOdemeler[k] = (db.fazlaOdemeler[k]||0) + fazlaTutar;
      alert(fmtMoney(tutar)+' kasaya eklendi.\n'+fmtMoney(fazlaTutar)+' fazla odeme.');
    } else {
      alert(fmtMoney(tutar)+' odeme kaydedildi.');
    }
    saveDB(); projeDetay(projeId);
  }catch(e){ console.error(e); alert('Hata: '+e.message); }
}

function projeSil(id){
  if(!isAdmin) return;
  if(!confirm('Proje silinsin mi?')) return;
  db.demirbasProjeler = db.demirbasProjeler.filter(function(p){ return p.id!==id; });
  saveDB(); safeRender();
}

function bildirimGonder(k){
  if(!isAdmin) return;
  try{
    var a = getApt(k);
    if(!a) return;
    if(!telGecerliMi(a.telefon)){ alert('Telefon kayitli degil.'); return; }
    var toplamBorc = aidatKalan(k) + demirbasToplamBorc(k);
    var fazla = fazlaOdemesi(k);
    var sablon = toplamBorc > 0 ? db.sablonlar.borcHatirlatma : db.sablonlar.borcYok;
    var mesaj = sablonDoldur(sablon, k);
    var body = '<h2>💬 WhatsApp Bildirim</h2>'
      + '<div class="li"><div class="li-t">Daire</div><div class="li-v">'+esc(k)+'</div></div>'
      + '<div class="li"><div class="li-t">Isim</div><div class="li-v" style="font-size:.82rem">'+esc(a.isim||'-')+'</div></div>'
      + '<div class="li"><div class="li-t">Telefon</div><div class="li-v" style="font-size:.82rem">'+esc(a.telefon)+'</div></div>'
      + '<div class="li"><div class="li-t">Toplam Borc</div><div class="li-v '+(toplamBorc>0?'red':'green')+'">'+fmtMoney(toplamBorc)+'</div></div>';
    if(fazla>0) body += '<div class="li"><div class="li-t">Alacak</div><div class="li-v teal">+'+fmtMoney(fazla)+'</div></div>';
    body += '<div class="fg" style="margin-top:12px"><label>Mesaj Onizleme</label><textarea class="fc" id="waMesaj" rows="14">'+esc(mesaj)+'</textarea></div>'
      + '<button class="btn btn-wa btn-block" onclick="waGonderOnayli(\''+esc(k)+'\')">💬 WhatsApp\'ta Ac</button>'
      + '<button class="btn btn-block" style="margin-top:8px" onclick="closeModal()">Iptal</button>';
    openModal(body);
  }catch(e){ console.error(e); }
}

function waGonderOnayli(k){
  if(!isAdmin) return;
  try{
    var mesaj = document.getElementById('waMesaj').value;
    if(whatsappGonder(k, mesaj)){ closeModal(); alert('✅ WhatsApp acildi.'); }
    else alert('Gonderilemedi.');
  }catch(e){ console.error(e); }
}

function viewBildirimler(){
  if(!isAdmin) return viewHome();
  try{
    var html = header('💬 Toplu WhatsApp','Bildirim gonder');
    html += '<div class="app">';
    var telefonlu = db.apartments.filter(function(a){ return telGecerliMi(a.telefon); }).length;
    var telefonsuz = db.apartments.filter(function(a){ return !telGecerliMi(a.telefon); }).length;
    var borclu = db.apartments.filter(function(a){ return (aidatKalan(aptKey(a))+demirbasToplamBorc(aptKey(a)))>0; });
    var borcluTel = borclu.filter(function(a){ return telGecerliMi(a.telefon); });
    html += '<div class="stats">'
      + '<div class="stat blue"><div class="lbl">📱 Telefonlu</div><div class="val">'+telefonlu+'/'+TOPLAM_DAIRE+'</div></div>'
      + '<div class="stat yellow"><div class="lbl">📵 Telefonsuz</div><div class="val">'+telefonsuz+'</div></div>'
      + '<div class="stat red"><div class="lbl">💳 Borclu Daire</div><div class="val">'+borclu.length+'</div></div>'
      + '<div class="stat green"><div class="lbl">✅ Gonderilebilir</div><div class="val">'+borcluTel.length+'</div></div>'
      + '</div>';
    html += '<div class="card"><div class="card-title">💬 Toplu Gonderim</div>'
      + '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px">'
      + '<button class="btn btn-sm btn-primary" onclick="topluSec(\'borclu\')">🔴 Borclulari Sec</button>'
      + '<button class="btn btn-sm btn-primary" onclick="topluSec(\'hepsi\')">✅ Tumunu Sec</button>'
      + '<button class="btn btn-sm" onclick="topluSec(\'temizle\')">🧹 Temizle</button>'
      + '<button class="btn btn-sm btn-wa" onclick="topluGonder()">💬 Gonder</button>'
      + '</div><div class="uyari">WhatsApp tek pencere acar.</div>'
      + '<div id="bildirimListesi">';
    db.apartments.forEach(function(a){
      var k = aptKey(a);
      var toplam = aidatKalan(k) + demirbasToplamBorc(k);
      var telVar = telGecerliMi(a.telefon);
      if(!telVar){
        html += '<div class="bildirim-satir no-phone"><div class="bs-info"><div class="bs-kod">'+esc(k)+' - '+esc(a.isim||'-')+'</div>'
          + '<div class="bs-tel" style="color:#c62828">📵 Telefon yok</div>'
          + '<button class="btn btn-xs btn-primary" style="margin-top:4px" onclick="hizliTelefon(\''+esc(k)+'\')">➕ Telefon Ekle</button></div>'
          + '<div class="bs-borc '+(toplam>0?'':'ok')+'">'+(toplam>0?fmtMoney(toplam):'borc yok')+'</div></div>';
      } else {
        html += '<label class="bildirim-satir"><input type="checkbox" class="bs-check" value="'+esc(k)+'" data-borc="'+toplam+'" '+(toplam>0?'checked':'')+'>'
          + '<div class="bs-info"><div class="bs-kod">'+esc(k)+' - '+esc(a.isim||'-')+'</div>'
          + '<div class="bs-tel">'+esc(a.telefon)+'</div></div>'
          + '<div class="bs-borc '+(toplam>0?'':'ok')+'">'+(toplam>0?fmtMoney(toplam):'borc yok')+'</div></label>';
      }
    });
    html += '</div></div></div>';
    return html;
  }catch(e){
    console.error('viewBildirimler error:', e);
    return '<div class="err-box">Bildirim sayfasi yuklenirken hata: '+esc(e.message)+'</div>';
  }
}

function topluSec(mod){
  var kutular = document.querySelectorAll('#bildirimListesi input[type="checkbox"]');
  for(var i = 0; i < kutular.length; i++){
    var c = kutular[i];
    var borc = Number(c.dataset.borc)||0;
    if(mod === 'hepsi') c.checked = true;
    else if(mod === 'borclu') c.checked = borc > 0;
    else if(mod === 'temizle') c.checked = false;
  }
}

function topluGonder(){
  var secili = [];
  var kutular = document.querySelectorAll('#bildirimListesi input[type="checkbox"]:checked');
  for(var i = 0; i < kutular.length; i++){ secili.push(kutular[i].value); }
  if(!secili.length){ alert('Daire secilmedi'); return; }
  if(!confirm(secili.length+' daireye WhatsApp acilacak.')) return;
  secili.forEach(function(k, i){ setTimeout(function(){ bildirimGonder(k); }, i * 700); });
}

function hizliTelefon(k){
  if(!isAdmin) return;
  var a = getApt(k);
  if(!a) return;
  var body = '<h2>📱 '+esc(k)+' - Telefon Ekle</h2>'
    + '<div class="fg"><label>Telefon (WhatsApp)</label><input class="fc" id="htel" value="'+esc(a.telefon||'')+'" placeholder="05xx xxx xx xx"></div>'
    + '<button class="btn btn-primary btn-block" onclick="hizliTelefonKaydet(\''+esc(k)+'\')">💾 Kaydet</button>';
  openModal(body);
}

function hizliTelefonKaydet(k){
  if(!isAdmin) return;
  var t = document.getElementById('htel').value.trim();
  if(!telGecerliMi(t)){ alert('Gecerli numara girin'); return; }

  if(!a) return;
  a.telefon = t;
  saveDB(); closeModal(); safeRender();
}

function viewSablonlar(){
  if(!isAdmin) return viewHome();

  if(!isAdmin) return;

  var body = '<h2>💰 '+esc(e.isim||'-')+' - Odeme Al</h2>'
    + '<div class="li"><div class="li-t">Kalan Borc</div><div class="li-v red">'+fmtMoney(kalan)+'</div></div>'

  openModal(body);
}

function eskiOdemeKaydet(id){
  if(!isAdmin) return;
  try{
    var e = db.eskiOturan.find(function(x){ return x.id===id; });
    if(!e) return;
    var tutar = Number(document.getElementById('e_odTutar').value)||0;
    if(tutar <= 0){ alert('Tutar girin'); return; }
    var kalan = Number(e.kalan)||0;
    var gercekTutar = Math.min(tutar, kalan);
    e.kalan = Math.max(0, kalan - gercekTutar);
    e.odenen = (Number(e.odenen)||0) + gercekTutar;
    bankaBakiEkle(gercekTutar);
    alert(fmtMoney(gercekTutar)+' kasaya eklendi.\nKalan: '+fmtMoney(e.kalan));
    saveDB(); closeModal(); safeRender();
  }catch(err){ console.error(err); }
}

function giderEkle(){
  if(!isAdmin) return;
  try{
    var rec = {
      id: Date.now(),
      aciklama: document.getElementById('g_aciklama').value.trim(),
      ay: document.getElementById('g_ay').value.trim(),

function giderGuncelle(id){
  if(!isAdmin) return;
  try{
    var g = db.giderler.find(function(x){ return x.id===id; });
    if(!g) return;
    var eskiTutar = Number(g.tutar)||0;
    var yeniTutar = Number(document.getElementById('g_tutar').value)||0;
    var fark = yeniTutar - eskiTutar;
    if(fark > 0){ bankaBakiDus(fark); } else if(fark < 0){ bankaBakiEkle(-fark); }
    g.aciklama = document.getElementById('g_aciklama').value.trim();
    g.ay = document.getElementById('g_ay').value.trim();
    g.tutar = yeniTutar;
    g.tarih = document.getElementById('g_tarih').value;
    g.durum = document.getElementById('g_durum').value;
    saveDB(); closeModal(); safeRender();
  }catch(e){ console.error(e); }
}

  if(!isAdmin) return;
  if(!confirm('Silinsin mi?')) return;
  var g = db.giderler.find(function(x){ return x.id===id; });
  if(g && Number(g.tutar) > 0){ bankaBakiEkle(Number(g.tutar)); }

function excelCikar(){
  if(!isAdmin) return;
  try{
    if(!window.XLSX){ alert('Excel kutuphanesi yuklenemedi'); return; }
    var wb = XLSX.utils.book_new();
    var genelData = [['SIRKINTI EVLERI - GENEL OZET'],['Tarih', new Date().toLocaleDateString('tr-TR')],[],['Toplam Daire', TOPLAM_DAIRE],['Aidat Tutari', getAidatTutar()],['Aidat Borcu Olan', db.apartments.filter(function(a){ return aidatKalan(aptKey(a))>0; }).length],[],['BANKA BAKIYESI', bankaBaki()],['TOPLAM GELIR', toplamAidatOdenen() + toplamBankaGelir()],['Toplam Gider', toplamGider()],[],['Toplam Aidat Alacagi', toplamAidatBorc()]];
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(genelData), 'GENEL');
    var dData = [['BLOK','DAIRE','ISIM','TELEFON','PLAKA','PIN DURUM','FAZLA ODEME']];
    db.apartments.forEach(function(a){
      var k = aptKey(a);
      dData.push([a.blok, a.daire, a.isim||'', a.telefon||'', a.plaka||'', a.pinDegistirildi?'Kisisel':'Varsayilan', fazlaOdemesi(k)||0]);
    });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(dData), 'DAIRELER');
    var aHeader = ['BLOK','DAIRE','ISIM'].concat(AY_ADLARI).concat(['ODENEN','FAZLA_ODEME','KALAN_BORC']);
    var aData = [aHeader];
    db.apartments.forEach(function(a){
      var k = aptKey(a);
      var row = db.aidat[k]||[];
      aData.push([a.blok, a.daire, a.isim||''].concat(AY_ADLARI.map(function(_, idx){
        var v = row[idx];
        if(v === undefined || v === null || v === '') return '';
        if(typeof v === 'number') return v;
        var n = Number(v);
        if(!isNaN(n) && n > 0) return n;
        return v;
      })).concat([aidatOdenen(k), fazlaOdemesi(k)||0, aidatKalan(k)]));
    });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aData), 'AIDAT');
    var gData = [['ACIKLAMA','AY','TUTAR','TARIH','DURUM']];
    db.giderler.forEach(function(g){ gData.push([g.aciklama||'', g.ay||'', g.tutar||0, g.tarih||'', g.durum||'']); });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(gData), 'GIDER');
    var bhData = [['DAIRE','TARIH','ISIM','TUTAR','ACIKLAMA']];
    (db.bankaHareketleri||[]).forEach(function(h){ bhData.push([h.daire||'', h.tarih||'', h.isim||'', h.tutar||0, h.aciklama||'']); });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(bhData), 'BANKA HAREKETLERI');
    XLSX.writeFile(wb, 'Sirkinti_Evleri_'+bugun()+'.xlsx');
  }catch(e){
    console.error('excelCikar error:', e);
    alert('Excel olusturulamadi: '+e.message);
  }
}

function daireAktarOnayla(){
  if(!isAdmin) return;
  try{
    var liste = window._excelDaireler || [];

    liste.forEach(function(d){
      var mevcut = db.apartments.find(function(a){ return a.blok === d.blok && a.daire === d.daire; });

function pdfAktarOnaylaAidat(){
  if(!isAdmin || !_pdfAktarOnizleme) return;
  if(!confirm(_pdfAktarOnizleme.length+' dairenin aidat verisi guncellenecek ve toplam gelir banka hareketlerine eklenecek. Emin misiniz?')) return;
  try{
    var AIDAT_TUTAR = getAidatTutar();
    var guncellenen = 0;
    var toplamGelirEklenecek = 0;
    var bugunISO = bugun();
    var bugunTR = bugunISO.split('-').reverse().join('.');

    _pdfAktarOnizleme.forEach(function(d){
      var k = BLOK_ADI + d.daire;
      var a = getApt(k);
      if(!a){
        db.apartments.push({ blok:BLOK_ADI, daire:d.daire, isim:d.isim, telefon:'', plaka:'', evsahibi:'', evTel:'', pin:'', pinDegistirildi:false, pinDeneme:0, pinKilit:0 });
        a = getApt(k);
        if(!db.aidat[k]) db.aidat[k] = new Array(12).fill('');
      } else if(d.isim && !a.isim){
        a.isim = d.isim;
      }

      var aylik = d.aylikDeger.map(function(v){
        if(v === '') return '';
        if(v === 'ODENDI') return AIDAT_TUTAR;
        if(v === 'ODENMEDI') return 'ÖDENMEDİ';
        return v;
      });
      db.aidat[k] = aylik;

      var odenen = d.odenenTutar || 0;
      if(odenen > 0){
        toplamGelirEklenecek += odenen;
        var mukerrer = db.bankaHareketleri.some(function(h){
          return h.daire === k && h.tutar === odenen && h.kaynak === 'aidat_pdf';
        });
        if(!mukerrer){
          db.bankaHareketleri.push({
            id: 'bh_aidat_' + Date.now() + '_' + Math.random().toString(36).slice(2,6),
            daire: k,
            tarih: bugunTR,
            isim: a.isim || d.isim || '-',
            tutar: odenen,
            aciklama: 'Aidat PDF aktarimi',
            kaynak: 'aidat_pdf',
            tarihISO: bugunISO
          });
        }
      }
      guncellenen++;
    });

    if(toplamGelirEklenecek > 0){
      bankaBakiEkle(toplamGelirEklenecek);
    }

    saveDB(); closeModal(); safeRender();
    alert('✅ '+guncellenen+' dairenin aidat verisi guncellendi!\n\n💵 Gelir eklendi: '+fmtMoney(toplamGelirEklenecek));
  }catch(e){
    console.error('pdfAktarOnaylaAidat error:', e);
    alert('Hata: '+e.message);
  }
}

function pdfAktarOnaylaIcmal(){
  if(!isAdmin || !_pdfAktarOnizleme) return;
  if(!confirm('Icmal gelirleri banka hareketlerine eklenecek. Emin misiniz?')) return;
  try{
    var eklenen = 0;
    _pdfAktarOnizleme.gelirler.forEach(function(g){
      var k = null;
      if(g.daire){ k = BLOK_ADI + g.daire; }
      else {
        var ilkAd = (g.isim||'').toUpperCase().split(' ')[0];
        if(ilkAd){
          var a = db.apartments.find(function(x){ return x.isim && x.isim.toUpperCase().indexOf(ilkAd) > -1; });
          if(a) k = aptKey(a);
        }
      }
      if(!k || !getApt(k)) return;
      var mukerrer = db.bankaHareketleri.some(function(h){ return h.daire === k && h.tarih === g.tarih && Number(h.tutar) === Number(g.tutar); });
      if(mukerrer) return;
      db.bankaHareketleri.push({ id: 'bh_' + Date.now() + '_' + Math.random().toString(36).slice(2,6), daire: k, tarih: g.tarih, isim: g.isim, tutar: g.tutar, aciklama: g.aciklama || '', kaynak: 'icmal_pdf' });
      bankaBakiEkle(Number(g.tutar)||0);
      eklenen++;
    });
    saveDB(); closeModal(); safeRender();
    alert('✅ '+eklenen+' gelir kaydi banka hareketlerine eklendi.');
  }catch(e){ console.error(e); alert('Hata: '+e.message); }
}

function pdfAktarOnaylaEnpara(){
  if(!isAdmin || !_pdfAktarOnizleme) return;
  if(!confirm('Enpara hareketleri islenecek. Emin misiniz?')) return;
  try{
    var eklenenGelir = 0, eklenenGider = 0;
    var sonBakiye = 0;
    _pdfAktarOnizleme.forEach(function(h){
      if(h.bakiye) sonBakiye = h.bakiye;
      if(h.gelir){
        var k = null;
        if(h.daire){ k = BLOK_ADI + h.daire; }
        else {
          var ilkAd = (h.isim||'').toUpperCase().split(' ')[0];
          if(ilkAd){
            var a = db.apartments.find(function(x){ return x.isim && x.isim.toUpperCase().indexOf(ilkAd) > -1; });
            if(a) k = aptKey(a);
          }
        }
        if(!k || !getApt(k)) return;
        var mukerrer = db.bankaHareketleri.some(function(x){ return x.daire === k && x.tarih === h.tarih && Number(x.tutar) === Number(h.tutar); });
        if(mukerrer) return;
        db.bankaHareketleri.push({ id: 'bh_' + Date.now() + '_' + Math.random().toString(36).slice(2,8), daire: k, tarih: h.tarih, isim: h.isim, tutar: h.tutar, aciklama: h.aciklama || '', kaynak: 'enpara_pdf' });
        eklenenGelir++;
      }
      else if(h.gider){
        var tarihISO = h.tarih.split('.').reverse().join('-');
        var mukerrer2 = db.giderler.some(function(g){ return g.aciklama === h.isim && Number(g.tutar) === Number(h.tutar) && g.tarih === tarihISO; });
        if(mukerrer2) return;
        db.giderler.push({
          id: Date.now() + Math.floor(Math.random()*1000),
          aciklama: h.isim + (h.aciklama ? ' - ' + h.aciklama.substring(0, 80) : ''),
          ay: h.tarih.split('.')[1] + '/' + h.tarih.split('.')[2],
          tutar: h.tutar,
          tarih: tarihISO,
          durum: 'Odendi'
        });
        eklenenGider++;
      }
    });
    if(sonBakiye > 0) db.bankaBakiyesi = sonBakiye;
    saveDB(); closeModal(); safeRender();
    alert('✅ '+eklenenGelir+' gelir, '+eklenenGider+' gider kaydedildi.\nBanka bakiyesi: '+fmtMoney(sonBakiye));
  }catch(e){ console.error(e); alert('Hata: '+e.message); }
}

function openModal(html){
  try{
    var body = document.getElementById('modBody');
    var mov = document.getElementById('mov');
    if(body && mov){
      body.innerHTML = html;
      mov.classList.add('open');
      _modalOpen = true;
    }
  }catch(e){ console.error('openModal error:', e); }
}

function closeModal(){
  try{
    var mov = document.getElementById('mov');
    var body = document.getElementById('modBody');
    if(mov) mov.classList.remove('open');
    if(body) body.innerHTML = '';
    _modalOpen = false;
  }catch(e){ console.error('closeModal error:', e); }
}

    if(mov){
      mov.addEventListener('click', function(e){
        if(e.target.id==='mov') closeModal();
      });
    }
    safeRenderNav();
    safeRender();
    initFirebase().catch(function(e){
      console.error('initFirebase unhandled:', e);
      setSyncStatus('error', 'Bulut baglantisi kurulamadi');
    });
  }catch(e){
    console.error('DOMContentLoaded error:', e);
    var app = document.getElementById('app');
    if(app) app.innerHTML = '<div class="err-box">Uygulama baslatilamadi: '+esc(e.message)+'</div>';
  }
});
